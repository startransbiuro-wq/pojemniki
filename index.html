/* ---------- SALDA KIEROWCÓW: każdy kierowca ma swój „magazyn” pojemników ----------
   + zabrał z firmy   − przywiózł do firmy   (wizyty u klientów pokazujemy tylko informacyjnie)
   Stan = ile pojemników kierowca ma „na sobie”: wszystko, co zabrał z firmy, minus wszystko, co przywiózł. */
function driverLedger(driverId){
  const d = S.data, P = S.showPal;
  const trips = d.trips.filter(t => t.driver_id === driverId && t.status !== 'anulowany')
    .sort((a, b) => (a.started_at || a.created_at).localeCompare(b.started_at || b.created_at));
  // zaakceptowane prośby o rozliczenie (tylko pojemniki): kierowca, który zabrał więcej +qty, opiekun trasy −qty
  const sets = P ? [] : (d.settlements || []).filter(x => x.status === 'zaakceptowana' && (x.debtor_id === driverId || (x.caretaker_id || x.requester_id) === driverId));
  const items = [...trips.map(t => ({ at: t.started_at || t.created_at, t })), ...sets.map(x => ({ at: x.accepted_at || x.created_at, x }))]
    .sort((a, b) => a.at.localeCompare(b.at));
  let stan = 0;
  return items.map(({ t, x }) => {
    if (x) {
      // obcy kierowca: 'zabral' → +qty, 'zostawil' → −qty; opiekun trasy odwrotnie
      const fs = (x.kind === 'zostawil' ? -1 : 1) * num(x.qty);
      const change = x.debtor_id === driverId ? fs : -fs;
      stan += change;
      return { x, me: driverId, load: 0, ret: 0, left: 0, took: 0, change, stan, open: false };
    }
    const mv = d.movements.filter(m => m.trip_id === t.id);
    const L = P ? t.pal_loaded : t.qty_loaded, R = P ? t.pal_returned : t.qty_returned;
    const load = num(L);
    const ret = t.status === 'zakonczony' ? num(R) : 0;
    const left = mv.reduce((a, m) => a + num(P ? m.pal_out : m.qty_out), 0);
    const took = mv.reduce((a, m) => a + num(P ? m.pal_in : m.qty_in), 0);
    const change = load - ret;
    stan += change;
    return { t, mv, load, ret, left, took, change, stan, open: t.status !== 'zakonczony' || R == null, unverified: L == null };
  });
}

async function saveOrder(){
  const st = S.ord;
  if (!st.cid) throw new Error('Wybierz klienta.');
  if (!st.date) throw new Error('Wybierz dzień dostawy.');
  const items = ordItems(st);
  const bad = items.filter(it => !(it.qty >= 0) || isNaN(it.qty));
  if (bad.length) throw new Error(`Niepoprawna ilość przy: ${bad.map(it => (prodById(it.product_id) || {}).name).join(', ')}.`);
  const clean = items.filter(it => it.qty > 0).map(it => ({ product_id: it.product_id, qty: it.qty }));
  if (!clean.length) throw new Error('Wpisz ilość przy co najmniej jednym produkcie.');
  const me = Auth.user ? Auth.user.display_name : null;
  const other = orderOf(st.cid, st.date, st.id);
  try {
    if (other) {
      if (!(await confirmBox('Klient ma już zamówienie na ten dzień', `Połączyć z istniejącym zamówieniem na ${dayLabel(st.date, true)}? Ilości tych samych produktów zostaną zsumowane.`, 'Połącz'))) return false;
      const m = new Map((other.items || []).map(it => [it.product_id, +it.qty || 0]));
      clean.forEach(it => m.set(it.product_id, (m.get(it.product_id) || 0) + it.qty));
      await db.update('orders', other.id, { items: [...m].map(([product_id, qty]) => ({ product_id, qty })), note: [other.note, st.note.trim()].filter(Boolean).join(' · ') || null, updated_by_name: me });
      if (st.id) await db.remove('orders', st.id);
    } else if (st.id) await db.update('orders', st.id, { contractor_id: st.cid, delivery_date: st.date, items: clean, note: st.note.trim() || null, updated_by_name: me });
    else await db.insert('orders', { contractor_id: st.cid, delivery_date: st.date, items: clean, note: st.note.trim() || null, created_by: Auth.user ? Auth.user.id : null, created_by_name: me });
  } catch(e){ if (/orders/.test(e.message || '')) throw new Error('Baza nie zna jeszcze zamówień. Uruchom plik supabase/migracja-opiekun.sql w Supabase → SQL Editor.'); throw e; }
  return true;
}

const plPL = (n, one, few, many) => n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many;
const normReg = v => String(v || '').toUpperCase().replace(/\s+/g, '');
const fnum = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const fL = v => `${(+v || 0).toLocaleString('pl-PL', { maximumFractionDigits: 2 })} l`;
const fZl = v => v == null || !isFinite(+v) ? '—' : `${(+v).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} zł`;
const FKIND = { wewnetrzne: ['Tankowanie wewnętrzne', 'p-blue'], obce: ['Tankowanie obce', 'p-amber'], dostawa: ['Dostawa paliwa', 'p-green'], stan: ['Stan zbiornika', 'p-grey'] };
// stan zbiornika: ostatni wpisany stan (pomiar) + dostawy − tankowania po nim
function fuelState(){
  const d = S.data, tanks = (d.fuel_tanks || []).filter(t => t.active !== false).sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  const all = (d.fuel_entries || []).slice().sort((a, b) => a.at.localeCompare(b.at) || a.created_at.localeCompare(b.created_at));
  const st = {};
  for (const t of tanks) {
    const es = all.filter(e => e.tank_id === t.id), base = es.filter(e => e.kind === 'stan').sort((a, b) => a.at.localeCompare(b.at) || (a.created_at || '').localeCompare(b.created_at || '')).pop() || null;
    let l = base ? +base.liters : 0;
    const after = e => !base || e.at > base.at || (e.at === base.at && e !== base && (e.created_at || '') > (base.created_at || ''));   // ta sama minuta → decyduje kolejność wpisania
    for (const e of es) if (after(e)) l += e.kind === 'dostawa' ? +e.liters : (e.kind === 'stan' ? 0 : -e.liters);
    const lastDel = es.filter(e => e.kind === 'dostawa').pop() || null;
    st[t.id] = { tank: t, liters: Math.round(l * 100) / 100, base, lastDel };
  }
  // średnia cena zakupu (ważona litrami) — do szacowania kosztu tankowań wewnętrznych
  const dels = all.filter(e => e.kind === 'dostawa' && +e.price_per_l > 0);
  const avgPrice = dels.length ? dels.reduce((a, e) => a + e.liters * e.price_per_l, 0) / dels.reduce((a, e) => a + +e.liters, 0) : null;
  return { tanks, st, all, avgPrice };
}
// spalanie: metoda „do pełna” — litry z tankowania / km od poprzedniego tankowania tego auta
function vehicleStats(){
  const d = S.data, out = {}, per = {};
  for (const e of (d.fuel_entries || []).filter(e => e.kind === 'wewnetrzne' && e.vehicle_id)) (per[e.vehicle_id] = per[e.vehicle_id] || []).push(e);
  for (const [vid, es] of Object.entries(per)) {
    es.sort((a, b) => (a.odometer ?? 0) - (b.odometer ?? 0) || a.at.localeCompare(b.at));
    const v = (d.vehicles || []).find(x => x.id === vid), start = v && v.start_odometer != null ? { odometer: +v.start_odometer } : null;   // przebieg przy dodaniu auta = start
    let L = 0, km = 0;
    es.forEach((e, i) => {
      const prev = es[i - 1] || start;
      if (prev && e.odometer != null && prev.odometer != null && e.odometer > prev.odometer) { e._km = e.odometer - prev.odometer; e._cons = e.liters / e._km * 100; L += +e.liters; km += e._km; }
    });
    out[vid] = { count: es.length, liters: es.reduce((a, e) => a + +e.liters, 0), lastOdo: Math.max(...es.map(e => e.odometer || 0)), avg: km ? L / km * 100 : null,
      last: es.filter(e => e._cons != null).pop() || null, km };
  }
  return out;
}

// od ostatniego wpisanego stanu (inwentaryzacji): + dostawy, − oddane dostawcom, − wyjazdy kierowców, + zwroty, ± wpisy od biura bez trasy
function stockLedger(){
  const d = S.data, counts = (d.stock_counts || []).slice().sort((a, b) => a.counted_at.localeCompare(b.counted_at));
  const base = counts[counts.length - 1] || null;
  const cName = id => (d.contractors.find(c => c.id === id) || {}).name || '—';
  const emp = id => fullName(d.employees.find(e => e.id === id));
  const ev = [];
  for (const m of d.movements) {
    const c = d.contractors.find(x => x.id === m.contractor_id); if (!c || m.source === 'bilans') continue;
    if (c.type === 'dostawca') ev.push({ at: m.created_at, kind: 'dostawa', q: num(m.qty_in) - num(m.qty_out), p: num(m.pal_in) - num(m.pal_out),
      text: `Dostawca: ${esc(c.name)}`, sub: mvText(m, true, true) || '', who: m.created_by_name || '' });
    else if (!m.trip_id && m.source === 'biuro') ev.push({ at: m.created_at, kind: 'biuro', q: -(num(m.qty_out) - num(m.qty_in)), p: -(num(m.pal_out) - num(m.pal_in)),
      text: `Wpis od biura: ${esc(c.name)}`, sub: mvText(m, false, true) || '', who: m.created_by_name || '' });
  }
  for (const t of d.trips) {
    if (t.status === 'anulowany') continue;
    if (t.qty_loaded != null || t.pal_loaded != null) ev.push({ at: t.verified_at || t.started_at || t.created_at, kind: 'wyjazd', q: -num(t.qty_loaded), p: -num(t.pal_loaded),
      text: `Wyjazd: ${esc(emp(t.driver_id))}`, sub: esc(tripRouteName(t)), trip: t.id });
    if (t.status === 'zakonczony' && (t.qty_returned != null || t.pal_returned != null)) ev.push({ at: t.return_verified_at || t.returned_at || t.started_at || t.created_at, kind: 'zwrot',
      q: num(t.qty_returned), p: num(t.pal_returned), text: `Zwrot: ${esc(emp(t.driver_id))}`, sub: esc(tripRouteName(t)), trip: t.id });
  }
  const after = base ? ev.filter(x => x.at > base.counted_at).sort((a, b) => a.at.localeCompare(b.at)) : [];
  let q = base ? num(base.qty) : 0, p = base ? num(base.pal) : 0;
  for (const x of after) { q += x.q; p += x.p; x.sq = q; x.sp = p; }
  const onRoad = d.trips.filter(t => ['w_trasie', 'powrot', 'powrot_poprawa'].includes(t.status));
  return { base, counts, events: after, q, p, onRoad };
}

// różnice u klientów na trasach z opiekunem, zrobione przez innego kierowcę (to, co widać w historii trasy i rozliczeniach z cudzych tras)
function transferDiffs(){
  const d = S.data, sets = d.settlements || [];
  const out = [];
  for (const m of d.movements) {
    if (!m.trip_id || num(m.qty_out) === num(m.qty_in)) continue;
    const t = d.trips.find(x => x.id === m.trip_id); if (!t || t.status === 'anulowany') continue;
    const st = d.route_stops.find(z => z.contractor_id === m.contractor_id && tripRouteIds(t).includes(z.route_id) && (c => c && c !== t.driver_id)((d.routes.find(r => r.id === z.route_id) || {}).caretaker_id));
    if (!st) continue;
    const route = d.routes.find(r => r.id === st.route_id), x = sets.find(y => y.movement_id === m.id);
    if (x && (x.status === 'zaakceptowana' || x.status === 'usunieta')) continue;
    out.push({ m, t, route, caretaker: route.caretaker_id, more: num(m.qty_in) - num(m.qty_out), x });
  }
  return out.sort((a, b) => (b.m.entered_at || b.m.created_at).localeCompare(a.m.entered_at || a.m.created_at));
}
async function pgTransfers(){
  const d = S.data, sets = (d.settlements || []).slice().sort((a, b) => (b.accepted_at || b.rejected_at || b.removed_at || b.created_at).localeCompare(a.accepted_at || a.rejected_at || a.removed_at || a.created_at));
  const emp = id => fullName(d.employees.find(e => e.id === id));
  const cn = id => (d.contractors.find(c => c.id === id) || {}).name || '—';
  const rn = id => (d.routes.find(r => r.id === id) || {}).name || '—';

  const list = sets.filter(x => F === 'all' || x.status === F);
  const diffs = transferDiffs();

  return `<div class="head"><div><h1>Przelewy</h1><p class="sub">Przelewy pojemników między kierowcami (rozliczenia różnic u klientów na cudzych trasach)</p></div></div>
  <div class="tabs" style="margin-bottom:14px">${tabs.map(([k, l]) => `<button data-act="trf" data-v="${k}" class="${F === k ? 'on' : ''}">${l} <span class="small muted">${k === 'all' ? sets.length : sets.filter(x => x.status === k).length}</span></button>`).join('')}</div>
  ${list.length ? `<div class="tw"><table style="min-width:760px"><thead><tr><th>Data</th><th>Klient · trasa</th><th>Różnica u klienta</th><th class="num">Ilość</th><th>Zmiana sald</th><th>Prosił</th><th>Status</th>${admin ? '<th></th>' : ''}</tr></thead><tbody>
    ${list.map(x => `<tr><td class="small">${fmtDT(when(x))}</td><td><b>${esc(cn(x.contractor_id))}</b><div class="small muted">${esc(rn(x.route_id))}</div></td>
      <td class="small">${esc(emp(x.debtor_id))} ${x.kind === 'zostawil' ? 'zostawił więcej, niż zabrał' : 'zabrał więcej, niż zostawił'}<div class="muted">opiekun trasy: ${esc(emp(x.caretaker_id || x.requester_id))}</div></td>
      <td class="num"><b>${num(x.qty)}</b></td><td class="small">${x.status === 'zaakceptowana' ? effHtml(x) : '<span class="muted">bez zmian</span>'}</td>
      <td class="small">${x.approver_id ? esc(emp(x.requester_id)) : '<span class="muted">— (usunięte z listy)</span>'}</td>
      <td><span class="pill ${ST[x.status][1]}">${ST[x.status][0]}</span>${x.status === 'usunieta' && x.removed_by_name ? `<div class="small muted">przez: ${esc(x.removed_by_name)}</div>` : ''}${x.reject_count ? `<div class="small muted">odrzucono ${x.reject_count}×</div>` : ''}</td>
      ${admin ? `<td class="num">${x.status !== 'usunieta' ? `<button class="btn sm bad" data-act="tr-remove" data-id="${x.id}" data-acc="${x.status === 'zaakceptowana' ? 1 : ''}">Usuń</button>` : ''}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>` : '<div class="panel empty">Brak przelewów w tej kategorii.</div>'}
  <h2 style="margin-top:28px">Nierozliczone różnice <span class="small muted" style="font-weight:400">(${diffs.length})</span></h2>
  <p class="small muted" style="margin-top:-6px">Wizyty innych kierowców na trasach z opiekunem, w których zostawiono inną liczbę pojemników, niż zabrano. Te same pozycje kierowcy widzą w „Historii trasy” i „Rozliczeniach z cudzych tras”.${admin ? ' „Usuń z listy” zdejmuje różnicę z tych list — wizyta i saldo klienta zostają bez zmian.' : ''}</p>
  ${diffs.length ? `<div class="tw"><table style="min-width:760px"><thead><tr><th>Wizyta</th><th>Klient · trasa</th><th>Kierowca</th><th>Opiekun trasy</th><th class="num">Zostawił</th><th class="num">Zabrał</th><th>Różnica</th><th>Prośba</th>${admin ? '<th></th>' : ''}</tr></thead><tbody>
    ${diffs.map(it => `<tr class="click" data-act="trip" data-id="${it.t.id}"><td class="small">${fmtDT(it.m.entered_at || it.m.created_at)}</td><td><b>${esc(cn(it.m.contractor_id))}</b><div class="small muted">${esc(it.route.name)}</div></td>
      <td>${esc(emp(it.t.driver_id))}</td><td>${esc(emp(it.caretaker))}</td><td class="num">${num(it.m.qty_out)}</td><td class="num">${num(it.m.qty_in)}</td>
      <td style="color:var(--red);font-weight:700;white-space:nowrap">${it.more > 0 ? `zabrał o ${it.more} więcej` : `zostawił o ${-it.more} więcej`}</td>

      ${admin ? `<td class="num"><button class="btn sm" data-act="tr-dismiss" data-id="${it.m.id}">Usuń z listy</button></td>` : ''}</tr>`).join('')}

  f.querySelectorAll('.perms input').forEach(i => i.onchange = sync);
  f.elements.employee_id.addEventListener('change', () => {
    const e = S.data.employees.find(x => x.id === f.elements.employee_id.value);

}

// Osoba z dwiema funkcjami: przełącznik „Kierowca / Magazyn” na górze linku (ten sam link, inny tryb)
async function linkRoles(token){
  S.roles = S.roles || {};
  if (!(token in S.roles)) {
    try {
      if (db.kind === 'supabase') S.roles[token] = await db.rpc('link_roles', { p_token: token });
      else { const e = (await db.list('employees', { eq: { link_token: token } }))[0]; S.roles[token] = e && e.active ? { id: e.id, name: `${e.first_name} ${e.last_name}`, driver: hasPos(e, 'kierowca'), warehouse: hasPos(e, 'magazynier') } : null; }
    } catch(err){ S.roles[token] = null; }
  }
  return S.roles[token];
}

      : `<div class="routes">${st.routes.filter(r => careIds.includes(r.id)).map(box).join('')}</div>
        ${others.length ? `<button class="btn" data-act="d-other" style="width:100%;margin-top:10px;justify-content:space-between">${otherOpen ? '▾' : '▸'} Inna trasa${otherSel ? ` (zaznaczone: ${otherSel})` : ''}<span class="small muted">${others.length}</span></button>

    const today = new Date().toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' });
    html = `<div class="drv"><div class="drvhead"><b>Dzień dobry, ${esc(e.first_name.toUpperCase())}</b><span class="small muted" style="white-space:nowrap">${today}</span></div>

      <div class="row" style="justify-content:space-between;align-items:center;margin:0 0 8px"><h2 style="font-size:15px;margin:0">Wybierz trasę</h2><button class="btn sm ghost" data-act="d-close">Zwiń ✕</button></div>
      ${routesHtml}
      <h2 style="font-size:15px;margin:18px 0 8px">Pojemniki do auta</h2>
      ${stepperHtml('dqty', qty, 'Liczba pojemników')}
      <h2 style="font-size:15px;margin:14px 0 8px">Palety H1 do auta</h2>
      ${stepperHtml('dpal', S.draft.pal ?? '', 'Liczba palet H1')}
      <p class="err" id="derr"></p></div>` : ''}
      ${stable}</div>
      <div class="bottombar">${S.draft.open ? '<button class="btn pri bigbtn" data-act="d-start" style="justify-content:center">Rozpocznij</button>' : '<button class="btn pri bigbtn" data-act="d-open" style="justify-content:center">Rozpocznij trasę</button>'}</div>`;
  } else if (t.status === 'oczekuje') {
    html = `<div class="drv" style="text-align:center">${hello}<div class="pulse">${CRATE_SVG}</div>
      <h1>Czekaj przy aucie</h1><p class="sub">Magazynier dostał powiadomienie i sprawdzi, czy w aucie jest <b>${t.qty_declared}</b> pojemników${palPart(t.pal_declared)}.<br>${(st.trip_routes || []).length > 1 ? 'Trasy' : 'Trasa'}: ${esc(st.route ? st.route.name : '')}</p>

  } else if (t.status === 'powrot') {
    html = `<div class="drv" style="text-align:center">${hello}<div class="pulse">${CRATE_SVG}</div>
      <h1>Czekaj na sprawdzenie zwrotu</h1><p class="sub">Magazynier dostał powiadomienie i policzy, czy oddajesz <b>${t.qty_return_declared}</b> pojemników${palPart(t.pal_return_declared)}.<br>Trasa: ${esc(st.route ? st.route.name : '')}</p>
      <p class="hint">Ekran odświeży się sam po zatwierdzeniu.</p><button class="btn" data-act="d-back">Wróć do trasy</button></div>`;
  } else if (t.status === 'powrot_poprawa') {
    html = `<div class="drv">${hello}<h1>Zwrot się nie zgadza</h1>
      <div class="card" style="border-left:4px solid var(--red);margin-bottom:18px">Zgłosiłeś zwrot <b>${t.qty_return_declared}</b> pojemników${palPart(t.pal_return_declared)}, a magazynier policzył <b>${t.qty_return_counted}</b> pojemników${num(t.pal_return_declared) || num(t.pal_return_counted) ? ` i <b>${num(t.pal_return_counted)}</b> palet H1` : ''}. Popraw liczby i wyślij ponownie.</div>
      <h2>Pojemniki</h2>${stepperHtml('dqty', S.draft.qty ?? t.qty_return_counted, 'Liczba pojemników')}
      <h2 style="margin-top:14px">Palety H1</h2>${stepperHtml('dpal', S.draft.pal ?? num(t.pal_return_counted), 'Liczba palet H1')}

      <button class="btn pri bigbtn" data-act="d-return-resubmit">Wyślij ponownie</button>
      <p style="text-align:center"><button class="btn ghost" data-act="d-back">Wróć do trasy</button></p></div>`;
  } else if (t.status === 'do_poprawy') {
    html = `<div class="drv">${hello}<h1>Ilość się nie zgadza</h1>
      <div class="card" style="border-left:4px solid var(--red);margin-bottom:18px">Wpisałeś <b>${t.qty_declared}</b> pojemników${palPart(t.pal_declared)}, a magazynier policzył <b>${t.qty_counted}</b> pojemników${num(t.pal_declared) || num(t.pal_counted) ? ` i <b>${num(t.pal_counted)}</b> palet H1` : ''}. Popraw liczby i wyślij ponownie.</div>
      <h2>Pojemniki</h2>${stepperHtml('dqty', S.draft.qty ?? t.qty_counted, 'Liczba pojemników')}
      <h2 style="margin-top:14px">Palety H1</h2>${stepperHtml('dpal', S.draft.pal ?? num(t.pal_counted), 'Liczba palet H1')}

      <button class="btn pri bigbtn" data-act="d-resubmit">Wyślij ponownie</button>

    const out = st.visits.reduce((a, m) => a + num(m.qty_out), 0), inn = st.visits.reduce((a, m) => a + num(m.qty_in), 0);
    const inCar = num(t.qty_loaded) - out + inn;
    const palInCar = num(t.pal_loaded) - st.visits.reduce((a, m) => a + num(m.pal_out), 0) + st.visits.reduce((a, m) => a + num(m.pal_in), 0);
    const visited = new Set(st.visits.map(v => v.contractor_id));
    const allIds = [...new Set(st.stops.map(c => c.id))];
    const tr = st.trip_routes || [];
    if (!S.drvTab || !tr.some(r => r.id === S.drvTab)) S.drvTab = tr.length ? tr[0].id : null;
    const shown = tr.length > 1 ? st.stops.filter(c => c.route_id === S.drvTab) : st.stops;
    html = `<div class="drv">
      <div class="truck"><div><div class="small muted">${esc(st.route ? st.route.name : '')}</div><b>${inCar}</b> <span class="muted small">pojemników w aucie</span>${num(t.pal_loaded) || palInCar ? `<div class="small" style="margin-top:2px"><b>${palInCar}</b> <span class="muted">palet H1 w aucie</span></div>` : ''}</div><span class="small muted">${allIds.filter(id => visited.has(id)).length}/${allIds.length} odwiedzonych</span></div>

        return `<button data-act="d-tab" data-v="${r.id}" class="${S.drvTab === r.id ? 'on' : ''}" style="flex:1 1 40%;padding:10px">${esc(r.name)} <span class="small muted">${ids.filter(id => visited.has(id)).length}/${ids.length}</span></button>`; }).join('')}</div>` : ''}
      <div class="grid" style="gap:10px">
      ${shown.length ? shown.map((c, i) => {
        const v = st.visits.filter(x => x.contractor_id === c.id);
        return `<div class="stop ${v.length ? 'done' : ''}">
          <div><div class="nm">${i + 1}. ${esc(c.name)}</div><div class="small muted">${esc(addressOf(c))}</div>
          <div class="small" style="margin-top:4px">Pojemniki: <b style="color:${owe(c.balance, 'odbiorca').theyOwe ? 'var(--red)' : 'inherit'}">${oweText(c.balance, 'odbiorca')}</b>${palOn(c) || num(c.pal_balance) ? ` <span class="palt">· palety H1: ${oweText(c.pal_balance, 'odbiorca')}</span>` : ''}${v.length ? ` · dziś: ${mvText(sumMv(v), false) || 'bez zmian'}` : ''}</div></div>
          <div class="acts"><a class="btn" href="${esc(mapsUrl(c))}" target="_blank" rel="noopener">Nawiguj</a><button class="btn ${v.length ? '' : 'pri'}" data-act="d-visit" data-id="${c.id}">${v.length ? 'Odwiedź ponownie' : 'Odwiedź'}</button></div>
        </div>`; }).join('') : '<div class="card empty">Do tej trasy nie przypisano jeszcze klientów. Zadzwoń do biura.</div>'}
      </div><p class="hint" style="text-align:center;margin-top:16px">${tr.length > 1 ? 'Licznik pojemników w aucie jest wspólny dla wszystkich tras tego kursu.' : ''}</p></div>
      <div class="bottombar"><button class="btn ok" data-act="d-finish">Zakończ trasę</button></div>`;
  }
  DRV.html = html;
}

function deliveryModal({ suppliers, preselect, who, save, allowDate = true }){
  if (!suppliers.length) return toast('Brak dostawców. Biuro musi ich dodać w zakładce Kontrahenci.', 'warn');
  const f = modal({ title: 'Nowa dostawa', submit: 'Zapisz dostawę', body: `<div class="f">
    <label class="l full">Dostawca<select name="cid">${suppliers.map(x => `<option value="${x.id}" ${x.id === preselect ? 'selected' : ''}>${esc(x.name)}${x.city ? ' — ' + esc(x.city) : ''}</option>`).join('')}</select>
      <span class="hint" id="supbal"></span></label>
    ${qtyFields(true)}
    ${allowDate ? `<label class="l full">Data dostawy<input name="date" type="datetime-local" value="${toLocalInput(new Date())}" max="${toLocalInput(new Date())}"></label>` : ''}
    <label class="l full">Uwagi<textarea name="note" placeholder="np. numer WZ, uszkodzone pojemniki"></textarea></label>
    <p class="hint full" style="margin:0">Dostawa zostanie zapisana jako: <b>${esc(who)}</b></p></div>`,
    onSubmit: async x => {
      const q = readQty(x);
      const date = allowDate ? dateFromInput(x.date) : new Date().toISOString();
      await save({ cid: x.cid, ...q, note: x.note || null, date: db.kind === 'supabase' ? date : x.date, iso: date });
      closeModal(); toast('Zapisano dostawę.');
    } });
  const sel = f.elements.cid;
  const showBal = () => { const x = suppliers.find(y => y.id === sel.value);
    const ps = f.querySelector('.pal-sec'), on = palOn(x);
    if (ps) { ps.hidden = !on; if (!on) { f.elements.pin.value = 0; f.elements.pout.value = 0; } }
    if (!x || x.balance == null) { $('#supbal').textContent = ''; return; }
    const t = (v, what) => `${what}: ${oweText(v, 'dostawca')}`;
    $('#supbal').innerHTML = on ? `Obecnie — ${t(x.balance, 'pojemniki')} · ${t(x.pal_balance || 0, 'palety H1')}` : `Obecnie — ${t(x.balance, 'pojemniki')} · nie uczestniczy w obrocie paletami H1`;
    $('#supbal').style.color = x.balance < 0 || (on && (x.pal_balance || 0) < 0) ? 'var(--red)' : ''; };
  sel.onchange = showBal; showBal();
}
function supplierHistoryHtml(sup, entries){
  const rows = entries.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
  let run = sup.balance, prun = num(sup.pal_balance);
  const withRun = rows.map(m => { const r = { m, after: run, pafter: prun }; run -= num(m.qty_in) - num(m.qty_out); prun -= num(m.pal_in) - num(m.pal_out); return r; });
  const bt = supBalText(sup.balance), pt = supBalText(num(sup.pal_balance), true);
  const showP = parseHash().page === 'm' || S.showPal;
  return `<div class="bigbal" style="margin-bottom:4px"><b style="color:${bt.red ? 'var(--red)' : 'inherit'}">${bt.n}</b><span class="muted">${bt.t}</span></div>
    ${showP && (palOn(sup) || num(sup.pal_balance)) ? `<div class="bigbal pal" style="margin-bottom:6px"><b style="color:${pt.red ? 'var(--red)' : 'var(--muted)'}">${pt.n}</b><span class="muted">${pt.t}</span></div>` : ''}
    ${addressOf(sup) ? `<p class="small muted" style="margin:0 0 14px">${esc(addressOf(sup))}</p>` : ''}
    <h3>Historia dostaw (${rows.length})</h3>
    ${rows.length ? `<div class="grid" style="gap:8px">${withRun.map(({ m, after, pafter }) => `<div class="card small" style="margin:0">
      <div class="row" style="justify-content:space-between"><b>${fmtDT(m.created_at)}</b><span class="muted">po wpisie: <b style="color:var(--ink)">${oweText(after, 'dostawca', ' poj.')}</b>${showP && (palOn(sup) || pafter) ? ` <span class="palt">· ${oweText(pafter, 'dostawca', ' pal.')}</span>` : ''}</span></div>
      <div>${mvText(m, true, showP)}</div>
      <div class="muted">${esc(m.created_by_name || SRC[m.source] || '')}${m.note && m.note !== SRC[m.source] ? ' · ' + esc(m.note) : ''}</div></div>`).join('')}</div>`
      : '<p class="muted">Brak dostaw od tego dostawcy.</p>'}`;
}
function staffSuppliers(){
  const bm = balances(S.data.movements);
  return S.data.contractors.filter(c => c.type === 'dostawca').sort((a, b) => a.name.localeCompare(b.name, 'pl'))
    .map(c => ({ id: c.id, name: c.name, city: c.city, balance: balOf(bm, c), pal_balance: palOf(bm, c), uses_pallets: palOn(c) }));

      <div>${mvText(m, false)}${m.this_trip ? ' <span class="pill p-blue">ten kurs</span>' : ''}</div>

    ${h.entries.length > limit ? `<button type="button" class="btn sm" id="chmore" style="margin-top:8px">Pokaż wszystkie (${h.entries.length})</button>` : ''}`;

function verifyModal({ kind, declared, expected, declaredPal = 0, expectedPal = null, driver, who, decision = 'ok', save }){
  const ret = kind === 'powrot';
  const photos = [null, null];
  const f = modal({ title: (ret ? 'Sprawdzenie zwrotu — ' : 'Sprawdzenie wyjazdu — ') + driver, submit: 'Zatwierdź', body: `
    <p style="margin-top:0">Kierowca ${ret ? 'zwraca' : 'deklaruje'} <b>${declared}</b> pojemników i <b>${num(declaredPal)}</b> palet H1.${ret && expected != null ? ` Według wpisów powinno być <b>${expected}</b> pojemników i <b>${num(expectedPal)}</b> palet H1.` : ''}</p>
    <h3>Zdjęcia paki auta z pojemnikami</h3>
    <p class="hint" style="margin-top:-4px">Wymagane dwa zdjęcia zrobione teraz aparatem. Na zdjęciu zapisze się data, godzina i Twoje nazwisko.</p>
    <div class="shots" id="shots"></div>
    <div class="radios" style="flex-direction:column;margin-top:16px">
      <label><input type="radio" name="decision" value="ok" ${decision === 'ok' ? 'checked' : ''}><span>Ilość się zgadza<small>${ret ? 'Trasa zostanie zakończona' : 'Kierowca rusza w trasę'}</small></span></label>
      <label><input type="radio" name="decision" value="accept" ${decision === 'accept' ? 'checked' : ''}><span>Nie zgadza się — zatwierdź policzoną ilość<small>${ret ? 'Trasa zakończy się z policzonym zwrotem' : 'Kierowca rusza z policzoną ilością'}</small></span></label>
      <label><input type="radio" name="decision" value="fix" ${decision === 'fix' ? 'checked' : ''}><span>Nie zgadza się — odeślij do poprawy<small>Kierowca musi poprawić liczbę</small></span></label>
    </div>
    <div class="f" id="cntwrap" style="margin-top:12px"><label class="l">Ile pojemników policzyłeś?<input name="counted" type="number" min="0" inputmode="numeric"></label>
      <label class="l">Ile palet H1 policzyłeś?<input name="counted_pal" type="number" min="0" inputmode="numeric" value="${num(declaredPal)}"></label></div>`,
    onSubmit: async x => {
      const ph = checkPhotos(photos);
      if (x.decision !== 'ok' && x.counted === '') throw new Error('Wpisz policzoną liczbę pojemników.');
      await save(x.decision, x.decision === 'ok' ? null : +x.counted, ph, x.decision === 'ok' ? null : (x.counted_pal === '' ? null : +x.counted_pal)); closeModal();
      toast(x.decision === 'fix' ? 'Odesłano kierowcy do poprawy.' : ret ? 'Zwrot zatwierdzony. Trasa zakończona.' : 'Zatwierdzono. Kierowca może ruszać.');
    } });
  const stamp = () => `${fmtDT(new Date())} · ${ret ? 'Powrót' : 'Wyjazd'} · ${driver} · sprawdza: ${who}`;
  const draw = () => {
    $('#shots').innerHTML = photos.map((p, i) => p
      ? `<div class="shot has"><img src="${p.data}" alt="Zdjęcie ${i + 1}"><button type="button" class="btn sm again" data-shot="${i}">Powtórz</button></div>`
      : `<button type="button" class="shot" data-shot="${i}"><span style="font-size:26px">📷</span>Zrób zdjęcie ${i + 1}</button>`).join('');
    $('#shots').querySelectorAll('[data-shot]').forEach(b => b.onclick = async () => {
      $('#merr').textContent = '';
      try { photos[+b.dataset.shot] = await capturePhoto(stamp()); draw(); }
      catch(e){ if (e) $('#merr').textContent = e.message; }
    });
  };
  const sync = () => { $('#cntwrap').style.display = f.querySelector('input[name=decision]:checked').value === 'ok' ? 'none' : ''; };
  f.querySelectorAll('input[name=decision]').forEach(r => r.onchange = sync);
  draw(); sync();
}

async function renderWarehouseLink(token){
  let st;
  try { st = await db.rpc('wh_get', { p_token: token }); }
  catch(e){ $('#app').innerHTML = `<div class="drv"><h1>Link nieaktywny</h1><p class="sub">${esc(e.message)}</p></div>`; return; }
  // osoba z dwiema funkcjami nie zatwierdza własnego kursu
  const own = () => false;   // osoba z dwiema funkcjami (kierowca + magazynier) może zatwierdzać także swoje kursy
  const ownNote = '<div class="small" style="margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel2)">To Twój kurs — zatwierdzi go inny magazynier.</div>';
  const reqs = [...st.waiting, ...st.returning];
  const ids = reqs.map(t => t.id + ':' + t.status);
  if (S.whSeen && S.wh && S.wh.token === token) {
    const fresh = reqs.filter(t => !S.whSeen.includes(t.id + ':' + t.status));
    if (fresh.length) {
      beep(); try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch(e){}
      fresh.forEach(t => { try { if ('Notification' in window && Notification.permission === 'granted') new Notification(t.status === 'powrot' ? `${t.driver_name} wrócił — sprawdź zwrot` : `${t.driver_name} czeka przy aucie`, { body: `${t.route_name} — ${t.status === 'powrot' ? t.qty_return_declared : t.qty_declared} pojemników` }); } catch(e){} });
    }
  }
  S.whSeen = ids; S.wh = { token, st };
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const tab = S.whTab || 'wyjazdy';
  const head = `<div class="drv">
    <p class="muted" style="margin:0">${new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <h1>Cześć, ${esc(st.employee.first_name)}</h1>
    ${perm === 'default' ? '<button class="btn bigbtn" data-act="w-perm" style="margin:8px 0 14px">Włącz powiadomienia i dźwięk</button>' : ''}
    <div class="tabs" style="display:flex;width:100%;margin:10px 0 18px">
      <button data-act="w-tab" data-v="wyjazdy" class="${tab === 'wyjazdy' ? 'on' : ''}" style="flex:1;padding:10px">Kierowcy ${reqs.length ? `<span class="badge">${reqs.length}</span>` : ''}</button>
      <button data-act="w-tab" data-v="dostawy" class="${tab === 'dostawy' ? 'on' : ''}" style="flex:1;padding:10px">Dostawy</button></div>`;
  if (tab === 'dostawy') {
    if (S.whSup) {
      let h;
      try { h = await db.rpc('wh_supplier_history', { p_token: token, p_contractor_id: S.whSup }); }
      catch(e){ S.whSup = null; return renderWarehouseLink(token); }
      $('#app').innerHTML = head + `<button class="btn ghost" data-act="w-back" style="padding-left:0">← Wszyscy dostawcy</button>
        <h2 style="margin-top:6px">${esc(h.supplier.name)}</h2>
        ${supplierHistoryHtml(h.supplier, h.entries)}</div>
        <div class="bottombar"><button class="btn pri" data-act="w-deliv" data-id="${h.supplier.id}">Dodaj dostawę od tego dostawcy</button></div>`;
      return;
    }
    $('#app').innerHTML = head + `<button class="btn pri bigbtn" data-act="w-deliv" style="margin-bottom:18px">Dodaj dostawę</button>
      <h2>Dostawcy</h2><p class="hint" style="margin-top:-6px">Dotknij dostawcy, żeby zobaczyć historię dostaw.</p>
      <div class="grid" style="gap:8px">${st.suppliers.length ? st.suppliers.map(x => `<div class="stop" data-act="w-sup" data-id="${x.id}" style="cursor:pointer;grid-template-columns:1fr auto;align-items:center">
        <div><div class="nm">${esc(x.name)}</div><div class="small muted">${esc(x.city || '')}</div></div>
        <div style="text-align:right">${[[x.balance, 'poj.'], ...(palOn(x) || num(x.pal_balance) ? [[num(x.pal_balance), 'pal. H1']] : [])].map(([v, u]) => (u === 'poj.' ? `<div style="color:${v < 0 ? 'var(--red)' : v > 0 ? 'var(--green)' : 'inherit'}"><span class="small">${owe(v, 'dostawca').theyOwe === null ? 'rozliczone' : owe(v, 'dostawca').t}</span> <b style="font-size:22px;font-stretch:72%">${Math.abs(v)}</b> <span class="small muted">${u}</span></div>`
        : `<div class="palt" style="${v < 0 ? 'color:var(--red)' : ''}">${oweText(v, 'dostawca', ' ' + u)}</div>`)).join('')}</div></div>`).join('')
        : '<div class="card empty">Brak dostawców. Biuro dodaje ich w zakładce Kontrahenci.</div>'}</div></div>`;
    return;
  }
  $('#app').innerHTML = head + `
    <p class="sub">Tu pojawiają się kierowcy czekający na sprawdzenie pojemników — przy wyjeździe i po powrocie z trasy. Zostaw tę stronę otwartą — usłyszysz sygnał.</p>
    ${st.returning.length ? `<h2>Powroty do sprawdzenia (${st.returning.length})</h2>
    <div class="grid" style="gap:10px;margin-bottom:22px">${st.returning.map(t => { const exp = num(t.qty_loaded) - num(t.out) + num(t.inn), diff = num(t.qty_return_declared) - exp;
      return `<div class="stop wait">
      <div><div class="row" style="justify-content:space-between"><span class="nm">${esc(t.driver_name)}</span><span class="pill p-amber">powrót ${fmtT(t.returned_at)}</span></div>
      <div class="small muted">${esc(t.route_name)} · wizyt: ${t.visits}</div></div>
      <div class="bigbal"><b>${t.qty_return_declared}</b><span class="muted">pojemników zwraca kierowca</span></div>
      <div class="small">Według wpisów w aucie powinno być <b>${exp}</b>${diff ? ` <span style="color:var(--red)">(różnica ${diff > 0 ? '+' : ''}${diff})</span>` : ''}</div>
      ${(ep => num(t.pal_return_declared) || ep ? `<div class="small">Palety H1: zwraca <b>${num(t.pal_return_declared)}</b>, powinno być <b>${ep}</b></div>` : '')(num(t.pal_loaded) - num(t.pout) + num(t.pin))}
      ${own(t) ? ownNote : `<div class="acts"><button class="btn ok" data-act="wr-ok" data-id="${t.id}">Zgadza się</button><button class="btn bad" data-act="wr-bad" data-id="${t.id}">Nie zgadza się</button></div>`}
    </div>`; }).join('')}</div>` : ''}
    <h2>Czekają przy aucie (${st.waiting.length})</h2>
    <div class="grid" style="gap:10px">
    ${st.waiting.length ? st.waiting.map(t => `<div class="stop wait">
      <div><div class="row" style="justify-content:space-between"><span class="nm">${esc(t.driver_name)}</span><span class="small muted">${fmtT(t.created_at)}</span></div>
      <div class="small muted">${esc(t.route_name)}</div></div>
      <div class="bigbal"><b>${t.qty_declared}</b><span class="muted">pojemników deklaruje kierowca</span></div>${num(t.pal_declared) ? `<div class="small">oraz <b>${num(t.pal_declared)}</b> palet H1</div>` : ''}
      ${own(t) ? ownNote : `<div class="acts"><button class="btn ok" data-act="w-ok" data-id="${t.id}">Zgadza się</button><button class="btn bad" data-act="w-bad" data-id="${t.id}">Nie zgadza się</button></div>`}
    </div>`).join('') : '<div class="card empty">Nikt nie czeka. Gdy kierowca zgłosi wyjazd, pojawi się tutaj.</div>'}
    </div>
    ${st.fixing.length || st.return_fixing.length ? `<h3 style="margin-top:22px">Odesłane do poprawy</h3>${st.fixing.map(t => `<div class="card small"><b>${esc(t.driver_name)}</b> — wyjazd: zadeklarował ${t.qty_declared}, policzono ${t.qty_counted}</div>`).join('')}${st.return_fixing.map(t => `<div class="card small"><b>${esc(t.driver_name)}</b> — zwrot: zgłosił ${t.qty_return_declared}, policzono ${t.qty_return_counted}</div>`).join('')}` : ''}
    <h3 style="margin-top:22px">W trasie (${st.onroad.length})</h3>
    ${st.onroad.length ? st.onroad.map(t => `<div class="card small"><b>${esc(t.driver_name)}</b> · ${esc(t.route_name)}<div class="muted">wyjazd ${fmtT(t.started_at)} · wizyt: ${t.visits}</div></div>`).join('') : '<p class="muted small">Nikt nie jest w trasie.</p>'}
    <p class="hint" style="text-align:center;margin-top:26px">To Twój stały link — działa codziennie, bez limitu. Możesz dodać go do ekranu głównego telefonu.</p>
    <p style="text-align:center"><button class="btn sm ghost" data-act="reload">↻ Odśwież</button></p>${linkFooter()}
  </div>`;
}

/* =====================================================================
   AKCJE (delegacja zdarzeń)
   ===================================================================== */
const A = {
  menu(){ $('.shell').classList.toggle('open'); },
  ktab(el){ S.ktab = el.dataset.v; render(); },
  etab(el){ S.etab = el.dataset.v; render(); },
  async seed(){ await seedDemo(); toast('Wczytano dane przykładowe.'); location.hash = '#/'; render(); },
  async wipe(){ if (await confirmBox('Wyczyścić dane?', 'Usunie kontrahentów, trasy, pracowników i historię z tej przeglądarki. Konta użytkowników zostaną.', 'Wyczyść')) { db.restore({ app_users: db.dump().app_users }); toast('Dane wyczyszczone.'); } },
  'notif-perm': async () => { try { await Notification.requestPermission(); } catch(e){} render(); },
  async logout(){ await Auth.logout(); },
  'my-pass'(){
    modal({ title: 'Zmień hasło', submit: 'Zmień hasło', body: `<div class="f">
      <label class="l full">Obecne hasło<input name="old" type="password" autocomplete="current-password"></label>
      <label class="l">Nowe hasło<input name="p1" type="password" autocomplete="new-password"></label>
      <label class="l">Powtórz nowe hasło<input name="p2" type="password" autocomplete="new-password"></label></div>`,
      onSubmit: async f => { await api.users.changeOwnPassword(f.old, f.p1, f.p2); closeModal(); toast('Hasło zmienione.'); } });
  },
  async 'u-new'(){ userForm({ permissions: PRESETS['Biuro'], active: true }, await api.users.list()); },
  async 'u-edit'(el){ const all = await api.users.list(); userForm(all.find(u => u.id === el.dataset.id), all); },
  async 'u-pass'(el){
    const u = (await api.users.list()).find(x => x.id === el.dataset.id);
    modal({ title: 'Nowe hasło — ' + u.display_name, submit: 'Ustaw hasło', body: `<div class="f">
      <label class="l">Nowe hasło<input name="p1" type="password" autocomplete="new-password"></label>
      <label class="l">Powtórz hasło<input name="p2" type="password" autocomplete="new-password"></label>
      <p class="hint full" style="margin:0">Przekaż hasło użytkownikowi osobiście. Po zalogowaniu może je zmienić.</p></div>`,
      onSubmit: async f => { checkNewPassword(f.p1, f.p2); await api.users.setPassword(u.id, f.p1); closeModal(); toast('Hasło ustawione.'); } });
  },
  async 'u-del'(el){
    const u = (await api.users.list()).find(x => x.id === el.dataset.id);
    if (await confirmBox('Usunąć użytkownika?', `${u.display_name} (${u.email}) nie będzie mógł się zalogować. Historia wpisów zostaje.`)) {
      try { await api.users.remove(u.id); toast('Usunięto użytkownika.'); render(); } catch(err){ toast(err.message, 'warn'); }
    }
  },

  /* kontrahenci */
  'c-new': () => contractorForm({ type: S.ktab === 'dostawca' ? 'dostawca' : 'odbiorca' }),
  'c-edit': el => contractorForm(S.data.contractors.find(c => c.id === el.dataset.id)),
  async 'c-del'(el){
    const c = S.data.contractors.find(x => x.id === el.dataset.id);
    if (await confirmBox('Usunąć kontrahenta?', `${c.name} zostanie usunięty razem z całą historią pojemników.`)) { await api.removeContractor(c.id); toast('Usunięto kontrahenta.'); location.hash = '#/kontrahenci'; }
  },
  'm-add'(el){ movementForm(el.dataset.id, el.dataset.src); },
  'sup-entry'(el){ movementForm(el.dataset.id || null, 'magazyn'); },
  'sup-hist'(el){
    const sup = staffSuppliers().find(x => x.id === el.dataset.id);
    const entries = S.data.movements.filter(m => m.contractor_id === sup.id);
    modal({ title: sup.name, wide: true, body: supplierHistoryHtml({ ...S.data.contractors.find(c => c.id === sup.id), balance: sup.balance, pal_balance: sup.pal_balance, uses_pallets: sup.uses_pallets }, entries),
      extra: `<button type="button" class="btn pri" data-act="sup-entry" data-id="${sup.id}">Dodaj dostawę</button>` });
  },

  /* trasy */
  'r-new': () => routeForm({}),
  'r-edit': el => routeForm(S.data.routes.find(r => r.id === el.dataset.id)),
  async 'r-del'(el){
    const r = S.data.routes.find(x => x.id === el.dataset.id);
    if (await confirmBox('Usunąć trasę?', `Trasa „${r.name}” zostanie usunięta. Odbiorcy zostaną odpięci od tej trasy (z innych tras nie), ich historia zostaje.`)) { await api.removeRoute(r.id); toast('Usunięto trasę.'); location.hash = '#/trasy'; }
  },
  async 'r-move'(el){
    const st = S.data.route_stops.find(x => x.id === el.dataset.id);
    const list = stopsOfRoute(st.route_id);
    const i = list.findIndex(x => x.id === st.id), j = i + +el.dataset.dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    S.keepScroll = true;
    for (let k = 0; k < list.length; k++) if (list[k].position !== k + 1) await api.setStopPos(list[k].id, k + 1);
  },
  async 'r-unassign'(el){ S.keepScroll = true; await api.removeStop(el.dataset.id); },
  'r-assign'(el){ assignForm(el.dataset.id); },

  /* kadry */
  'e-new': () => employeeForm({ position: S.etab === 'all' ? 'kierowca' : S.etab, active: true }),
  'e-edit': el => employeeForm(S.data.employees.find(e => e.id === el.dataset.id)),
  async 'e-del'(el){
    const e = S.data.employees.find(x => x.id === el.dataset.id);
    if (await confirmBox('Usunąć pracownika?', `${fullName(e)} zostanie usunięty.`)) { try { await api.removeEmployee(e.id); toast('Usunięto pracownika.'); } catch(err){ toast(err.message, 'warn'); } }
  },
  async 'e-copy'(el){
    const e = S.data.employees.find(x => x.id === el.dataset.id); const link = personLink(e);
    try { await navigator.clipboard.writeText(link); toast('Skopiowano link dla: ' + fullName(e)); }
    catch(err){ modal({ title: 'Link kierowcy', body: `<label class="l">Skopiuj i wyślij kierowcy SMS-em<input value="${esc(link)}" readonly onfocus="this.select()"></label>` }); }
  },
  async 'e-regen'(el){
    if (await confirmBox('Wygenerować nowy link?', 'Stary link przestanie działać.', 'Wygeneruj')) { await api.regenToken(el.dataset.id); toast('Nowy link gotowy.'); }
  },

  /* magazyn */
  'verify-ok'(el, ev, decision = 'ok'){
    const t = S.data.trips.find(x => x.id === el.dataset.id);
    verifyModal({ kind: 'wyjazd', declared: t.qty_declared, declaredPal: t.pal_declared, driver: fullName(S.data.employees.find(e => e.id === t.driver_id)), who: Auth.user.display_name, decision,
      save: (dec, cnt, ph, cp) => api.verifyTrip(t.id, dec, cnt, ph, cp) });
  },
  'verify-bad'(el, ev){ A['verify-ok'](el, ev, 'accept'); },
  'return-ok'(el, ev, decision = 'ok'){
    const t = S.data.trips.find(x => x.id === el.dataset.id);
    const tmv = S.data.movements.filter(m => m.trip_id === t.id);
    verifyModal({ kind: 'powrot', declared: t.qty_return_declared, expected: expectedReturn(t, tmv),
      declaredPal: t.pal_return_declared, expectedPal: expectedPalReturn(t, tmv),
      driver: fullName(S.data.employees.find(e => e.id === t.driver_id)), who: Auth.user.display_name, decision,
      save: (dec, cnt, ph, cp) => api.verifyReturn(t.id, dec, cnt, ph, cp) });
  },
  'return-bad'(el, ev){ A['return-ok'](el, ev, 'accept'); },
  /* link magazyniera */
  'wr-ok'(el, ev, decision = 'ok'){
    const t = S.wh.st.returning.find(x => x.id === el.dataset.id), e = S.wh.st.employee;
    verifyModal({ kind: 'powrot', declared: t.qty_return_declared, expected: num(t.qty_loaded) - num(t.out) + num(t.inn),
      declaredPal: t.pal_return_declared, expectedPal: num(t.pal_loaded) - num(t.pout) + num(t.pin), driver: t.driver_name, who: `${e.first_name} ${e.last_name}`, decision,
      save: async (dec, cnt, ph, cp) => { await db.rpc('wh_verify_return', { p_token: S.wh.token, p_trip_id: t.id, p_decision: dec, p_counted: cnt, p_photos: ph, p_counted_pal: cp }); render(); } });
  },
  'wr-bad'(el, ev){ A['wr-ok'](el, ev, 'accept'); },
  'w-ok'(el, ev, decision = 'ok'){
    const t = S.wh.st.waiting.find(x => x.id === el.dataset.id), e = S.wh.st.employee;
    verifyModal({ kind: 'wyjazd', declared: t.qty_declared, declaredPal: t.pal_declared, driver: t.driver_name, who: `${e.first_name} ${e.last_name}`, decision,
      save: async (dec, cnt, ph, cp) => { await db.rpc('wh_verify', { p_token: S.wh.token, p_trip_id: t.id, p_decision: dec, p_counted: cnt, p_photos: ph, p_counted_pal: cp }); render(); } });
  },
  'w-bad'(el, ev){ A['w-ok'](el, ev, 'accept'); },
  'photo-view'(el){
    const ov = document.createElement('div'); ov.className = 'pview'; ov.innerHTML = `<img src="${el.querySelector('img').src}" alt="Zdjęcie paki">`;
    ov.onclick = () => ov.remove(); document.body.appendChild(ov);
  },
  'w-tab'(el){ S.whTab = el.dataset.v; S.whSup = null; window.scrollTo(0, 0); render(); },
  'w-sup'(el){ S.whSup = el.dataset.id; window.scrollTo(0, 0); render(); },
  'w-back'(){ S.whSup = null; render(); },
  'w-deliv'(el){
    const st = S.wh.st;
    deliveryModal({ suppliers: st.suppliers, preselect: el.dataset.id || S.whSup, who: `${st.employee.first_name} ${st.employee.last_name}`,
      allowDate: false,   // z linku zawsze data bieżąca — zmienić ją może tylko aplikacja główna
      save: async x => { await db.rpc('wh_add_delivery', { p_token: S.wh.token, p_contractor_id: x.cid, p_qty_in: x.qty_in, p_qty_out: x.qty_out, p_pal_in: x.pal_in, p_pal_out: x.pal_out, p_note: x.note }); render(); } });
  },
  async 'w-perm'(){ unlockAudio(); try { await Notification.requestPermission(); } catch(e){} render(); },

  /* kursy */
  trip(el){
    const d = S.data, t = d.trips.find(x => x.id === el.dataset.id);
    const mv = d.movements.filter(m => m.trip_id === t.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const emp = id => d.employees.find(e => e.id === id);
    const editableTrip = can('magazyn') && ['w_trasie', 'zakonczony'].includes(t.status);
    modal({ title: 'Kurs — ' + fullName(emp(t.driver_id)), wide: true, body: `
      <dl class="kv" style="margin-bottom:10px"><dt>${tripRouteIds(t).length > 1 ? 'Trasy' : 'Trasa'}</dt><dd>${esc(tripRouteName(t))}</dd>
      <dt>Status</dt><dd>${statusPill(t.status)}</dd><dt>Deklaracja kierowcy</dt><dd>${t.qty_declared} poj.${PP(t.pal_declared)}</dd>
      <dt>Policzył magazyn</dt><dd>${t.qty_counted ?? '—'}${t.qty_counted != null ? ' poj.' + PP(t.pal_counted) : ''} ${t.verified_at ? `<span class="muted">(${esc(t.verified_by_name || fullName(emp(t.verified_by)))}, ${fmtDT(t.verified_at)})</span>` : ''}</dd>
      <dt>Wziął z firmy</dt><dd><b>${t.qty_loaded ?? '—'}</b>${t.qty_loaded != null ? ' poj.' + PP(t.pal_loaded) : ''}</dd>
      <dt>Wyjazd / powrót</dt><dd>${fmtDT(t.started_at)} / ${fmtDT(t.returned_at || t.finished_at)}</dd>
      <dt>Zwrot — zgłosił kierowca</dt><dd>${t.qty_return_declared ?? '—'}${t.qty_return_declared != null ? ' poj.' + PP(t.pal_return_declared) : ''}</dd>
      <dt>Zwrot — policzył magazyn</dt><dd>${t.qty_return_counted ?? '—'}${t.qty_return_counted != null ? ' poj.' + PP(t.pal_return_counted) : ''} ${t.return_verified_at ? `<span class="muted">(${esc(t.return_verified_by_name || '')}, ${fmtDT(t.return_verified_at)})</span>` : ''}</dd>
      <dt>Zwrot na magazyn</dt><dd><b>${t.qty_returned ?? '—'}</b>${t.qty_returned != null ? ' poj.' + PP(t.pal_returned) : ''}</dd>
      ${t.backfill ? `<dt>Rodzaj wpisu</dt><dd><span class="pill p-grey">wpis wsteczny</span> ${esc(t.note || '')}</dd>` : ''}</dl>
      <div class="row" style="margin-bottom:16px">${editableTrip ? `<button class="btn sm" data-act="trip-edit" data-id="${t.id}">Edytuj ilości kursu</button>` : ''}${can('uzytkownicy') && t.status === 'zakonczony' ? `<button class="btn sm" data-act="trip-visit" data-id="${t.id}">+ Dodaj wizytę</button>` : ''}${editedInfo(t, 'trip')}</div>
      <h3>Zdjęcia paki</h3><div id="tripphotos" class="small muted" style="margin-bottom:16px">Wczytywanie zdjęć…</div>
      ${mv.length ? `<div class="tw"><table style="min-width:600px"><thead><tr><th>Godzina</th><th>Klient</th>${sixHead('rec')}<th>Uwagi</th><th></th></tr></thead><tbody>
      ${mv.map(m => `<tr><td>${fmtT(m.created_at)}</td><td>${esc((d.contractors.find(c => c.id === m.contractor_id) || {}).name || '—')}${editedInfo(m, 'movement') ? '<br>' + editedInfo(m, 'movement') : ''}</td>${sixCells(mvTot(m), 'rec', 'odbiorca', palOn(d.contractors.find(c => c.id === m.contractor_id)), true)}<td class="small">${esc(m.note || '')}</td>

        S.draft = {}; closeModal(); window.scrollTo(0, 0); render();
      } });
  }
};

// zamówienia: Enter w wyszukiwarce klienta wybiera pierwszego, Enter w ilości przechodzi do następnego produktu
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.dataset && t.dataset.input === 'ord-cq') { e.preventDefault(); const b = [...document.querySelectorAll('.ord .ocl')].find(x => !x.hidden && !x.closest('[hidden]')); if (b) b.click(); }
  else if (t.dataset && t.dataset.oq) { e.preventDefault(); const all = [...document.querySelectorAll('[data-oq]')].filter(x => !x.closest('[hidden]')); const i = all.indexOf(t); if (all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); } else t.blur(); }
  else if (t.dataset && t.dataset.input === 'ord-f') { e.preventDefault(); const f = [...document.querySelectorAll('[data-oq]')].find(x => !x.closest('[hidden]')); if (f) { f.focus(); f.select(); } }
});
document.addEventListener('click', e => {
  const hr = e.target.closest('tr[data-href]');
  if (hr && !e.target.closest('a,button,[data-act]')) { location.hash = hr.dataset.href; return; }
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) {
    if (el.tagName !== 'A' || el.getAttribute('href') === '#') e.preventDefault();
    const act = el.dataset.act;
    const need = act === 'm-add' ? (el.dataset.src === 'magazyn' ? 'magazyn' : 'kontrahenci_edit') : ACT_PERM[act];
    if (need && !['k', 'm'].includes(parseHash().page) && !can(need)) { toast('Nie masz uprawnień do tej operacji.', 'warn'); return; }
    Promise.resolve(A[el.dataset.act](el, e)).catch(err => { console.error(err); toast(err.message, 'warn'); }); return; }
  const go = e.target.closest('[data-go]');
  if (go && !e.target.closest('a,button')) location.hash = go.dataset.go;
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (k === 'df-q') { S.df.q = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('[data-input="df-q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); }
  if (k === 'kq') { S.kq = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('[data-input=kq]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); }
  if (k === 'ord-cq' && S.ord) { S.ord.cq = e.target.value; ordClientFilterDom(); }
  if (k === 'ord-f' && S.ord) { S.ord.f = e.target.value; ordFilterDom(); }
  if (k === 'ord-note' && S.ord) S.ord.note = e.target.value;
  if (e.target.dataset.oq && S.ord) {
    const pid = e.target.dataset.oq, v = e.target.value; S.ord.qty[pid] = v;
    const row = e.target.closest('.orow'); if (row) { row.classList.toggle('has', v.trim() !== ''); const p = prodById(pid), q = fnum(v), k = q > 0 && p && p.unit !== 'kg' ? itemKg(p, q) : null; const o = row.querySelector('.okg'); if (o) o.textContent = k != null ? `≈ ${fQty(Math.round(k * 10) / 10)} kg` : ''; }
    ordRefresh();
  }
  if (k === 'pq') { S.pq = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('[data-input=pq]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); }
  if (k === 'fq') { S.fq = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('[data-input=fq]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); }
  if (k === 'd-qty') S.draft.qty = e.target.value;
  if (k === 'd-pal') S.draft.pal = e.target.value;
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'd-route') { const lb = e.target.closest('label'); if (lb) lb.classList.toggle('on', e.target.checked); const set = new Set(S.draft.routes || []); e.target.checked ? set.add(e.target.value) : set.delete(e.target.value); S.draft.routes = [...set]; }
  if (k === 'df') { S.df[e.target.dataset.k] = e.target.value; e.target.blur(); render(); }
  if (k === 'tf') { S.tf[e.target.dataset.k] = e.target.value; e.target.blur(); render(); }
  if (k === 'odate' && e.target.value) { S.odate = e.target.value; render(); }
  if (k === 'ord-date' && e.target.value && S.ord) { S.ord.date = e.target.value; render(); }
  if (k === 'poff') { S.poff = e.target.checked; render(); }
  if (k === 'fk' || k === 'ft') { S[k] = e.target.value; e.target.blur(); render(); }
  if (k === 'fd') { (S.fd = S.fd || { from: '', to: '' })[e.target.dataset.k] = e.target.value; e.target.blur(); S.keepScroll = true; render(); }
  if (k === 'appUrl') {
    const v = e.target.value.trim();
    if (v && !/^https?:\/\//.test(v)) { toast('Adres musi zaczynać się od https://', 'warn'); return; }
    prefs.set('appUrl', v); toast(v ? 'Zapisano. Skopiuj linki w Kadrach ponownie.' : 'Linki będą budowane z bieżącego adresu.');
  }
});

        <div class="row" style="gap:6px;margin-top:2px">${d.routes.length ? d.routes.slice().sort((a, b) => a.name.localeCompare(b.name, 'pl')).map(r => `<label class="pill p-grey" style="cursor:pointer;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center">
          <input type="checkbox" name="rt_${r.id}" ${c.id && routesOfC(c.id).some(x => x.id === r.id) ? 'checked' : ''}>${esc(r.name)}</label>`).join('') : '<span class="muted small">Brak tras — dodaj je w zakładce Trasy.</span>'}</div></div>
      <label class="full" style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer">
        <input type="checkbox" name="uses_pallets" ${palOn(c) ? 'checked' : ''} style="margin-top:3px">
        <span><b>Uczestniczy w obrocie paletami H1</b><small class="hint" style="display:block">Gdy odznaczone, przy dostawach i wizytach nie pojawią się pola na palety.</small></span></label>
      ${isNew ? `<label class="l">Stan początkowy — pojemniki<input name="opening" type="number" min="0" inputmode="numeric" placeholder="0"></label>
      <label class="l" id="openPalWrap">Stan początkowy — palety H1<input name="opening_pal" type="number" min="0" inputmode="numeric" placeholder="0"></label>
      <span class="hint full" id="openHint" style="margin-top:-6px"></span>` : ''}
      <label class="l full">Uwagi<textarea name="notes">${esc(c.notes || '')}</textarea></label>
      <input type="hidden" name="regon" value="${esc(c.regon || '')}">
    </div>`,
    onSubmit: async x => {
      if (!x.name.trim()) throw new Error('Wpisz nazwę firmy.');
      const nip = x.nip.replace(/\D/g, '');
      if (nip && nip.length !== 10) throw new Error('NIP musi mieć 10 cyfr.');
      const usesPal = !!x.uses_pallets;
      const route_ids = d.routes.filter(r => x['rt_' + r.id]).map(r => r.id);
      const saved = await api.saveContractor({ ...x, id: c.id, nip, name: x.name.trim(), uses_pallets: usesPal, route_ids }, { qty: num(x.opening), pal: usesPal ? num(x.opening_pal) : 0 });
      closeModal(); toast(isNew ? 'Dodano kontrahenta.' : 'Zapisano zmiany.');
      if (isNew) location.hash = '#/kontrahent/' + saved.id;
    } });
  const sync = () => {
    const t = f.querySelector('input[name=type]:checked').value;
    $('#routeWrap').style.display = t === 'odbiorca' ? '' : 'none';
    const oh = $('#openHint'); if (oh) oh.textContent = t === 'odbiorca' ? 'Ile pojemników i palet H1 ten klient dziś nam wisi.' : 'Ile pojemników i palet H1 my dziś wisimy temu dostawcy.';
  };
  f.querySelectorAll('input[name=type]').forEach(r => r.onchange = sync); sync();
  const syncPal = () => { const w = $('#openPalWrap'); if (w) w.style.display = f.elements.uses_pallets.checked ? '' : 'none'; };
  f.elements.uses_pallets.onchange = syncPal; syncPal();
  $('#gus').onclick = async () => {
    const msg = $('#gusmsg'); msg.style.color = ''; msg.textContent = 'Pobieram dane…';
    try {
      const r = await lookupNip(f.elements.nip.value);
      ['name', 'street', 'postal_code', 'city', 'regon'].forEach(k => { if (r[k]) f.elements[k].value = r[k]; });
      f.elements.nip.value = String(r.nip || f.elements.nip.value).replace(/\D/g, '');
      msg.style.color = 'var(--green)'; msg.textContent = `Dane pobrane${r.source === 'gus' ? ' z GUS' : r.source === 'mf' ? ' z Wykazu podatników VAT (MF)' : ''}. Sprawdź adres przed zapisaniem.`;
    } catch(e){ msg.style.color = 'var(--red)'; msg.textContent = e.message; }
  };
}

  modal({ title: 'Przypisz odbiorców do trasy', submit: 'Zapisz', wide: true, body: `

    <div style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px">

/* =====================================================================
   LOGOWANIE
   Tryb lokalny: konta w tabeli app_users (hasła PBKDF2) — chroni przed
   przypadkowym dostępem na wspólnym komputerze.
   Tryb Supabase: prawdziwe logowanie Supabase Auth + uprawnienia sprawdzane
   także w bazie (RLS), więc nie da się ich obejść.
   ===================================================================== */
const Auth = {
  user: null,
  can(p){ return !!(this.user && this.user.active && (this.user.permissions || []).includes(p)); },
  async ensure(){
    if (db.kind === 'supabase') {
      const { data } = await db.client.auth.getSession();
      if (!data.session) { this.user = null; this.renderLogin(); return false; }
      let rows = [], err = null;
      try { rows = await db.list('app_users', { eq: { auth_user_id: data.session.user.id } }); } catch(e){ err = e.message; }
      this.user = rows[0] || null;
      if (!this.user) { this.renderBlocked(err ? `Nie udało się odczytać profilu: ${err}` : `Konto ${data.session.user.email} jest zalogowane, ale nie ma profilu w aplikacji. Administrator musi dodać je w zakładce Użytkownicy (albo powiązać w tabeli app_users).`); return false; }
      if (!this.user.active) { this.renderBlocked('To konto jest zablokowane. Odblokuje je administrator w zakładce Użytkownicy.'); return false; }
      return true;
    }
    const users = await db.list('app_users');
    if (!users.length) { this.user = null; this.renderSetup(); return false; }
    const id = prefs.get('session');
    this.user = users.find(u => u.id === id && u.active) || null;
    if (!this.user) { this.renderLogin(); return false; }
    return true;
  },
  async login(email, pwd){
    SYNC.data = null;   // nowy użytkownik = pełne pobranie danych od nowa
    email = email.trim().toLowerCase();
    if (db.kind === 'supabase') {
      const { error } = await db.client.auth.signInWithPassword({ email, password: pwd });
      if (error) {   // pokaż konkretną przyczynę, żeby łatwiej było ją naprawić
        const m = (error.message || '').toLowerCase();
        if (m.includes('invalid login')) throw new Error('Nieprawidłowy e-mail lub hasło. Jeśli konto zakładano w wersji lokalnej, trzeba je założyć ponownie w zakładce Użytkownicy.');
        if (m.includes('not confirmed')) throw new Error('Konto nie jest potwierdzone. W Supabase (Authentication → Users) potwierdź je albo załóż ponownie z opcją Auto Confirm.');
        if (m.includes('banned')) throw new Error('To konto jest zablokowane. Odblokuje je administrator w zakładce Użytkownicy.');
        throw new Error('Logowanie nieudane: ' + error.message);
      }
      return;
    }
    const u = (await db.list('app_users', { eq: { email } }))[0];
    if (!u || !(await checkPassword(pwd, u.password_hash))) throw new Error('Nieprawidłowy e-mail lub hasło.');
    if (!u.active) throw new Error('To konto jest zablokowane. Skontaktuj się z administratorem.');
    prefs.set('session', u.id);
    await db.update('app_users', u.id, { last_login_at: new Date().toISOString() });
  },
  async logout(){
    SYNC.data = null;
    if (db.kind === 'supabase') await db.client.auth.signOut(); else prefs.set('session', '');
    this.user = null; S.seenNotif = null; location.hash = ''; render();
  },
  shell(inner){
    $('#app').innerHTML = `<div class="auth"><div class="brand" style="justify-content:center"><img src="${LOGO}" alt="Star Drób" class="logo" style="max-width:280px"></div>${inner}</div>`;
  },
  bind(fn){
    const f = $('#authform');
    f.onsubmit = async e => {
      e.preventDefault(); const btn = f.querySelector('button'); btn.disabled = true; $('#lerr').textContent = '';
      try { await fn(Object.fromEntries(new FormData(f).entries())); render(); }
      catch(err){ $('#lerr').textContent = err.message; }
      finally { btn.disabled = false; }
    };
    const i = f.querySelector('input'); if (i) i.focus();
  },
  renderLogin(){
    this.shell(`<h1>Zaloguj się</h1><p class="sub">Konto zakłada administrator w zakładce Użytkownicy.</p>
      <form id="authform" class="grid" style="gap:12px"><label class="l">E-mail<input name="email" type="email" autocomplete="username"></label>
      <label class="l">Hasło<input name="password" type="password" autocomplete="current-password"></label><p class="err" id="lerr"></p>
      <button class="btn pri bigbtn">Zaloguj</button></form>`);
    this.bind(x => this.login(x.email, x.password));
  },
  renderSetup(){
    this.shell(`<h1>Utwórz konto administratora</h1><p class="sub">To pierwsze uruchomienie. Administrator ma wszystkie uprawnienia i może dodawać kolejnych użytkowników.</p>
      <form id="authform" class="grid" style="gap:12px"><label class="l">Imię i nazwisko<input name="display_name" autocomplete="name"></label>
      <label class="l">E-mail (login)<input name="email" type="email" autocomplete="username"></label>
      <label class="l">Hasło<input name="p1" type="password" autocomplete="new-password" placeholder="min. 8 znaków"></label>
      <label class="l">Powtórz hasło<input name="p2" type="password" autocomplete="new-password"></label><p class="err" id="lerr"></p>
      <button class="btn pri bigbtn">Utwórz konto i zaloguj</button></form>`);
    this.bind(async x => {
      if (!x.display_name.trim()) throw new Error('Wpisz imię i nazwisko.');
      if (!/^\S+@\S+\.\S+$/.test(x.email.trim())) throw new Error('Wpisz poprawny adres e-mail.');
      checkNewPassword(x.p1, x.p2);
      const u = await api.users.create({ display_name: x.display_name, email: x.email, password: x.p1, permissions: PRESETS['Administrator'], active: true });
      prefs.set('session', u.id);
      await db.update('app_users', u.id, { last_login_at: new Date().toISOString() });
    });
  },
  renderBlocked(reason){
    this.shell(`<h1>Brak dostępu</h1><p class="sub">${esc(reason || 'Twoje konto nie jest aktywne albo nie ma przypisanych uprawnień. Skontaktuj się z administratorem.')}</p>
      <button class="btn" data-act="logout">Wyloguj</button>`);
  }
};

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Nie udało się wczytać ' + src)); document.head.appendChild(s); }); }
async function boot(){
  if (CONFIG.backend === 'supabase') {
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
    db = createSupabaseAdapter();
    db.client.auth.onAuthStateChange(() => scheduleRender());
  } else {
    db = createLocalAdapter();
    const legacy = (await db.list('contractors')).filter(c => c.route_id);
    for (const c of legacy.sort((a, b) => (a.route_order || 0) - (b.route_order || 0))) {
      if (!(await db.list('route_stops', { eq: { route_id: c.route_id, contractor_id: c.id } })).length)
        await db.insert('route_stops', { route_id: c.route_id, contractor_id: c.id, position: c.route_order || 0 });
      await db.update('contractors', c.id, { route_id: null, route_order: null });
    }
  }
  let t; db.subscribe(() => { if (document.hidden) return; clearTimeout(t); t = setTimeout(() => { DB_DIRTY = true; scheduleRender(); }, db.kind === 'supabase' ? 1000 : 300); });
  // Odświeżanie w tle — oszczędnie (limit transferu w Supabase):
  //  link kierowcy: co 5 s tylko gdy czeka na magazyniera, inaczej co 60 s · link magazyniera: co 10 s · biuro: co 20 s (same zmiany)
  let tick = 0;
  setInterval(() => {
    tick++;
    if (document.hidden) return;
    const pg = parseHash().page;
    const waiting = S.driver && S.driver.st && S.driver.st.trip && ['oczekuje', 'do_poprawy', 'powrot', 'powrot_poprawa'].includes(S.driver.st.trip.status);
    const every = pg === 'k' ? (waiting ? 1 : 12) : pg === 'm' ? 2 : db.kind === 'supabase' ? (pg === 'moj' && waiting ? 1 : 4) : 0;
    if (every && tick % every === 0) scheduleRender();
  }, 5000);
  window.addEventListener('hashchange', () => { S.draft = {}; closeModal(); window.scrollTo(0, 0); render(); });
  render();
}
boot().catch(e => { $('#app').innerHTML = `<div class="drv"><h1>Nie udało się uruchomić</h1><p class="sub">${esc(e.message)}</p></div>`; });
</script>
