<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Drób — obrót pojemnikami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8FB; --panel:#FFFFFF; --panel2:#F0F4F8; --ink:#1E2A36; --muted:#66727F; --line:#DFE5EB;
  --crate:#2270C4; --crate-soft:#E4EFFB; --side:#FFFFFF; --side-ink:#4A5866;
  --amber:#A96F06; --amber-soft:#FBEFD6; --red:#A2342A; --red-soft:#F7E0DD; --green:#2A7549; --green-soft:#DDF0E3;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--crate)}
:focus-visible{outline:3px solid var(--crate);outline-offset:2px}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;color:var(--ink);font-weight:750;font-stretch:88%;font-size:18px;line-height:1.1}
.brand svg{flex:none}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:7px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a.on{background:var(--crate-soft);color:var(--crate);font-weight:650}
.badge{background:var(--amber);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.side .foot{margin-top:auto;font-size:12px;padding:12px 8px 0;border-top:1px solid var(--line)}
.side .foot .me{display:flex;flex-direction:column;margin-bottom:8px;font-size:14px}
.side .foot .me span{color:var(--muted);font-size:12px}
.perms{display:grid;gap:6px}
.perms label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink);font-size:14px}
.perms label:has(input:checked){border-color:var(--crate);background:var(--crate-soft)}
.perms small{display:block;color:var(--muted)}
.auth{max-width:400px;margin:0 auto;padding:12vh 18px 40px}
.auth .brand{color:var(--ink);padding:0 0 22px}
.logo{display:block;width:100%;max-width:190px;height:auto}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:none}
h1{font-size:28px;font-stretch:85%;font-weight:750;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;margin:0 0 12px}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--panel);padding:16px 18px}
.stat b{display:block;font-size:34px;font-stretch:72%;font-weight:750;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat > span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--crate);border-color:var(--crate);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--panel);border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);min-width:220px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel2)}
tr:last-child td{border-bottom:0}
table.one th,table.one td{white-space:nowrap;padding:8px 8px}
table.tight th,table.tight td{padding:9px 8px}
table.tight td:first-child,table.tight th:first-child{padding-left:12px}
table.one th:first-child,table.one td:first-child{padding-left:14px}
table.one .cut{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
tfoot td{background:var(--panel2);font-weight:700;border-top:2px solid var(--line);border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-green{background:var(--green-soft);color:var(--green)}
.p-red{background:var(--red-soft);color:var(--red)}
.p-blue{background:var(--crate-soft);color:var(--crate)}
.p-grey{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.bal{font-variant-numeric:tabular-nums;font-weight:700}
.bal.pos{color:var(--red)} .bal.neg{color:var(--green)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px}
.card+.card{margin-top:10px}
.wait{border-left:4px solid var(--amber)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.bigbal{display:flex;align-items:baseline;gap:12px}
.bigbal b{font-size:56px;font-stretch:68%;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.linkbox{display:flex;gap:6px;align-items:center}
.linkbox code{font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:4px 8px;border-radius:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}

/* formularze */
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f .full{grid-column:1/-1}
label.l{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.l input,label.l select,label.l textarea{padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:400;font-size:15px}
label.l textarea{min-height:70px;resize:vertical}
.radios{display:flex;gap:8px}
.radios label{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.radios label:has(input:checked){border-color:var(--crate);background:var(--crate-soft)}
.radios small{display:block;color:var(--muted);font-weight:400}
.err{color:var(--red);font-size:13px;min-height:1em}
.hint{font-size:13px;color:var(--muted)}

/* modal */
.mb{position:fixed;inset:0;background:rgba(30,42,54,.3);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;z-index:50;overflow:auto}
.md{background:var(--panel);border-radius:12px;width:100%;max-width:560px;border:1px solid var(--line);animation:pop .16s ease-out}
.md.wide{max-width:820px}
.md header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.md header h2{margin:0}
.md .bd{padding:18px 20px}
.md footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.cam{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.cam-bar .btn{justify-self:start}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
.shutter:active{transform:scale(.94)}
.cam-hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{border:2px dashed var(--line);border-radius:10px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--panel2);cursor:pointer;color:var(--muted);font-weight:600;padding:8px;text-align:center}
.shot.has{border:2px solid var(--green);padding:0;overflow:hidden;position:relative;cursor:default}
.shot.has img{width:100%;height:100%;object-fit:cover}
.shot.has .again{position:absolute;right:6px;bottom:6px}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pgal button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:none;cursor:zoom-in;text-align:left}
.pgal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pgal span{display:block;font-size:12px;padding:4px 6px;color:var(--muted)}
.pview{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:85;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.pview img{max-width:100%;max-height:100%;border-radius:6px}
/* widok: same pojemniki / pojemniki + palety H1 */
.viewbar{display:flex;align-items:center;gap:10px;margin:-6px 0 18px;flex-wrap:wrap}
.viewbar .tabs button{display:flex;align-items:center;gap:6px}
th.palc{background:var(--crate-soft)}
th.palc,td.palc{border-left-color:var(--line)}
.stats.pal{margin-top:-8px}
.bigbal.pal{margin-top:10px}
.bigbal.pal b{font-size:44px}
.pal-sec{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.palt{color:var(--muted)}
/* historia wpisów kontrahenta */
table.hist{min-width:560px}
table.hist th{font-size:12px;padding:8px 12px}
table.hist td{padding:11px 12px;border-bottom-color:var(--panel2)}
table.hist tbody tr:not(.day):hover td{background:var(--panel2)}
table.hist tr.day td{background:var(--bg);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:7px 12px;border-bottom:1px solid var(--line)}
table.hist .tm{font-weight:650;font-variant-numeric:tabular-nums}
table.hist .by{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
table.hist td.q{font-size:16px;font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
table.hist td.q.z{color:var(--line);font-weight:400}
table.hist .sp{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
table.hist .sp b{font-size:16px;font-variant-numeric:tabular-nums}
table.hist .sp span{font-size:11px;font-weight:600}
table.hist .sp.r{color:var(--red)} table.hist .sp.g{color:var(--green)} table.hist .sp.m{color:var(--muted)}
table.hist .note{font-size:13px;color:var(--muted);max-width:260px;white-space:normal}
table.hist .acts{opacity:.5;transition:opacity .15s} table.hist tr:hover .acts{opacity:1}
table.hist .acts .btn{padding:3px 8px;font-size:12px}
table.hist tfoot td{font-size:14px}
.src{display:inline-block;font-size:10.5px;font-weight:650;padding:0 6px;border-radius:99px;margin-left:5px;vertical-align:1px}
.src.kierowca{background:var(--crate-soft);color:var(--crate)} .src.magazyn{background:var(--amber-soft);color:var(--amber)}
.src.biuro{background:var(--green-soft);color:var(--green)} .src.bilans{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.sortbtn{border:0;background:none;font:inherit;color:inherit;font-weight:600;cursor:pointer;padding:2px 6px;margin:-2px -6px;border-radius:6px;white-space:nowrap}
.sortbtn:hover{background:var(--line)}
.sortbtn span{display:inline-block;width:12px;text-align:center;opacity:.55}
.sortbtn.on{color:var(--crate)} .sortbtn.on span{opacity:1}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.t{background:#FFFFFF;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--crate);padding:11px 16px;border-radius:8px;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:pop .2s}
.t.warn{border-left-color:var(--amber);background:var(--amber-soft)}

/* widok kierowcy */
.drv{max-width:560px;margin:0 auto;padding:18px 14px 90px}
.drv h1{font-size:26px}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:stretch}
.stepper button{min-width:72px;font-size:34px;line-height:1;font-weight:600;touch-action:manipulation;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
.stepper input{font-size:44px;font-stretch:72%;font-weight:750;text-align:center;border:2px solid var(--crate);border-radius:10px;padding:6px;background:var(--panel);min-width:0;width:100%}
.routes{display:grid;gap:8px}
.routes label{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;font-weight:650;cursor:pointer;display:flex;gap:10px;align-items:center}
.routes label:has(input:checked){border-color:var(--crate);background:var(--crate-soft)}
.bigbtn{width:100%;padding:16px;font-size:18px;border-radius:10px}
.pulse{width:74px;height:74px;border-radius:50%;background:var(--amber-soft);margin:10px auto 18px;display:grid;place-items:center;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.08)}}
.stop{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.stop.done{border-left:5px solid var(--green)}
.stop .nm{font-weight:700;font-size:16px}
.stop .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stop .acts .btn{padding:12px}
.truck{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:12px}
.truck b{font-size:30px;font-stretch:72%;font-variant-numeric:tabular-nums}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bottombar .btn{width:100%;max-width:532px;margin:0 auto;display:flex;padding:14px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none;box-shadow:0 0 40px rgba(30,42,54,.15)}
  .top{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;background:var(--side);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .top button{background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer}
  .main{padding-top:18px}
  .f{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   KONFIGURACJA
   Po założeniu projektu w Supabase zmień backend na 'supabase'
   i uzupełnij adres oraz klucz "anon" (Project Settings → API).
   ===================================================================== */
const APP_VERSION = '2026-10-02b';   // zmieniaj przy każdej nowej wersji — widać ją na ekranach kierowcy i magazyniera
const CONFIG = {
  backend: 'supabase',
  supabaseUrl: 'https://ynzgrlqqvegsttkmqwbi.supabase.co',
  supabaseAnonKey: 'sb_publishable_gPs3oxSOCSJ5w6Qe-szePw_auQjD6qX',
  gusFunctionUrl: 'https://ynzgrlqqvegsttkmqwbi.supabase.co/functions/v1/gus-lookup',
  appUrl: 'https://startransbiuro-wq.github.io/pojemniki/'
};

/* =====================================================================
   WARSTWA DANYCH
   Cała aplikacja korzysta wyłącznie z obiektu `db` (list/get/insert/update/
   remove/rpc/subscribe). Nazwy tabel i kolumn są identyczne jak w pliku
   supabase/schema.sql, więc zamiana adaptera nie wymaga zmian w interfejsie.
   ===================================================================== */
const TABLES = ['routes','contractors','employees','trips','movements','notifications','edit_log','balance_confirmations','route_stops','app_users'];
const DATA_TABLES = TABLES.filter(t => t !== 'app_users');   // użytkownicy ładowani osobno
const ACTIVE_TRIP = ['oczekuje','do_poprawy','w_trasie','powrot','powrot_poprawa'];
const ON_ROUTE = ['w_trasie','powrot','powrot_poprawa'];   // kierowca ma przypisane wizyty

function createLocalAdapter(){
  const KEY = 'pojemniki.db.v1';
  const empty = () => Object.fromEntries(TABLES.map(t => [t, []]));
  let mem = null;
  const subs = new Set();
  const emit = () => subs.forEach(f => { try { f(); } catch(e){ console.error(e); } });
  const migrate = d => {   // zgodność z wcześniejszą wersją (driver_token → link_token)
    for (const e of d.employees) if ('driver_token' in e) { if (!e.link_token) e.link_token = e.driver_token; delete e.driver_token; }
    for (const u of d.app_users || []) if (!u.perm_v) { u.perm_v = 2; if ((u.permissions || []).includes('kadry') && !u.permissions.includes('linki')) u.permissions = [...u.permissions, 'linki']; }
    return d;
  };
  const read = () => {
    try { const raw = localStorage.getItem(KEY); return migrate(raw ? { ...empty(), ...JSON.parse(raw) } : (mem || empty())); }
    catch(e){ return mem || empty(); }
  };
  const write = d => { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} emit(); };
  window.addEventListener('storage', e => { if (e.key === KEY) emit(); });   // zmiany z innych kart
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
  const match = (row, eq) => !eq || Object.entries(eq).every(([k, v]) => Array.isArray(v) ? v.includes(row[k]) : row[k] === v);
  const sortRows = (rows, order) => {
    if (!order) return rows;
    const [col, dir] = order;
    return rows.slice().sort((a, b) => {
      const x = a[col], y = b[col];
      if (x === y) return 0; if (x == null) return 1; if (y == null) return -1;
      return (x < y ? -1 : 1) * (dir === 'desc' ? -1 : 1);
    });
  };
  return {
    kind: 'local',
    async list(t, { eq, order } = {}) { return sortRows(read()[t].filter(r => match(r, eq)), order); },
    async get(t, id) { return read()[t].find(r => r.id === id) || null; },
    async insert(t, row) { const d = read(); const r = { id: uid(), created_at: new Date().toISOString(), ...row }; d[t].push(r); write(d); return r; },
    async update(t, id, patch) {
      const d = read(); const i = d[t].findIndex(r => r.id === id);
      if (i < 0) throw new Error('Nie znaleziono rekordu.');
      d[t][i] = { ...d[t][i], ...patch }; write(d); return d[t][i];
    },
    async remove(t, id) { const d = read(); d[t] = d[t].filter(r => r.id !== id); write(d); },
    async rpc(name, args) { const fn = LocalRpc[name]; if (!fn) throw new Error('Brak funkcji ' + name); return fn(args || {}); },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    dump: () => read(),
    restore: d => write({ ...empty(), ...d })
  };
}

// kolumny czytane wprost z tabel; link_token pracowników jest ukryty i dostępny tylko przez funkcję staff_employee_links
const COLS = { employees: 'id,first_name,last_name,position,phone,active,created_at' };
function createSupabaseAdapter(){
  const client = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  const chk = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    kind: 'supabase', client,
    async list(t, { eq, order } = {}) {
      let q = client.from(t).select(COLS[t] || '*');
      for (const [k, v] of Object.entries(eq || {})) q = Array.isArray(v) ? q.in(k, v) : q.eq(k, v);
      if (order) q = q.order(order[0], { ascending: order[1] !== 'desc', nullsFirst: false });
      return chk(await q);
    },
    async get(t, id) { return chk(await client.from(t).select(COLS[t] || '*').eq('id', id).maybeSingle()); },
    async insert(t, row) { return chk(await client.from(t).insert(row).select(COLS[t] || '*').single()); },
    async update(t, id, patch) { return chk(await client.from(t).update(patch).eq('id', id).select(COLS[t] || '*').single()); },
    async remove(t, id) { chk(await client.from(t).delete().eq('id', id)); },
    async rpc(name, args) { return chk(await client.rpc(name, args || {})); },
    subscribe(f) {
      const ch = client.channel('zmiany').on('postgres_changes', { event: '*', schema: 'public' }, () => f()).subscribe();
      return () => client.removeChannel(ch);
    }
  };
}

// Wspólna logika weryfikacji wyjazdu (z linku magazyniera i z komputera zalogowanego użytkownika)
/* ---------- ZDJĘCIA PAKI (weryfikacja wyjazdu i powrotu) ----------
   Zdjęcie robione na żywo aparatem w przeglądarce (getUserMedia) — nie da się wybrać pliku z galerii.
   Na zdjęciu nanoszona jest data, godzina i osoba sprawdzająca. */
const PHOTO_MAX_AGE = 15 * 60000;   // zdjęcie musi być zrobione najwyżej 15 min przed zatwierdzeniem
let capturePhoto = (stamp) => new Promise(async (resolve, reject) => {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia))
    return reject(new Error('Ta przeglądarka nie udostępnia aparatu. Otwórz stronę w Chrome lub Safari (adres https).'));
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false }); }
  catch(e){ return reject(new Error('Brak dostępu do aparatu. Zezwól przeglądarce na użycie aparatu i spróbuj ponownie.')); }
  const ov = document.createElement('div'); ov.className = 'cam';
  ov.innerHTML = `<video playsinline autoplay muted></video><div class="cam-hint">Sfotografuj pakę auta z pojemnikami</div>
    <div class="cam-bar"><button type="button" class="btn" data-x="cancel">Anuluj</button><button type="button" class="shutter" data-x="shot" aria-label="Zrób zdjęcie"></button><span></span></div>`;
  document.body.appendChild(ov);
  const v = ov.querySelector('video'); v.srcObject = stream;
  const stop = () => { stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  ov.querySelector('[data-x=cancel]').onclick = () => { stop(); reject(null); };
  ov.querySelector('[data-x=shot]').onclick = () => {
    if (!v.videoWidth) return;
    const sc = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
    const g = c.getContext('2d'); g.drawImage(v, 0, 0, c.width, c.height);
    const fs = Math.max(14, Math.round(c.width / 42)), pad = Math.round(fs * .5);
    g.font = `600 ${fs}px sans-serif`; const tw = g.measureText(stamp).width;
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - fs - pad * 2, tw + pad * 2, fs + pad * 2);
    g.fillStyle = '#fff'; g.textBaseline = 'bottom'; g.fillText(stamp, pad, c.height - pad);
    const data = c.toDataURL('image/jpeg', .7); stop(); resolve({ data, taken_at: new Date().toISOString() });
  };
});
function checkPhotos(photos){
  const ok = (photos || []).filter(p => p && /^data:image\/(jpeg|png|webp);base64,/.test(p.data || ''));
  if (ok.length < 2) throw new Error('Dodaj dwa zdjęcia paki auta z pojemnikami.');
  if (ok.some(p => Math.abs(Date.now() - new Date(p.taken_at)) > PHOTO_MAX_AGE)) throw new Error('Zdjęcia muszą być zrobione teraz. Zrób je ponownie.');
  return ok;
}
// Tryb lokalny: zdjęcia w IndexedDB (dużo miejsca), a nie w localStorage
const PhotoStore = (() => {
  let dbp = null; const mem = [];
  const open = () => dbp || (dbp = new Promise(res => {
    try { const r = indexedDB.open('pojemniki-zdjecia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' }).createIndex('trip', 'trip_id');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch(e){ res(null); }
  }));
  return {
    async add(rows){
      const d = await open(); if (!d) { mem.push(...rows); return; }
      await new Promise((res, rej) => { const tx = d.transaction('photos', 'readwrite'); rows.forEach(r => tx.objectStore('photos').put(r)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    },
    async removeTrip(tripId){
      const d = await open(); if (!d) { for (let i = mem.length - 1; i >= 0; i--) if (mem[i].trip_id === tripId) mem.splice(i, 1); return; }
      const list = await this.list(tripId);
      await new Promise(res => { const tx = d.transaction('photos', 'readwrite'); list.forEach(p => tx.objectStore('photos').delete(p.id)); tx.oncomplete = res; tx.onerror = res; });
    },
    async list(tripId){
      const d = await open(); if (!d) return mem.filter(p => p.trip_id === tripId);
      return new Promise(res => { const q = d.transaction('photos').objectStore('photos').index('trip').getAll(tripId); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); });
    }
  };
})();
async function savePhotos(tripId, phase, photos, who){
  const now = new Date().toISOString();

}

async function verifyCore(tripId, decision, counted, who, photos){
  const t = await db.get('trips', tripId);
  if (!t || t.status !== 'oczekuje') throw new Error('Ten kurs nie czeka już na weryfikację.');
  if (decision !== 'ok' && !(counted >= 0)) throw new Error('Wpisz policzoną liczbę pojemników.');
  photos = checkPhotos(photos);
  const now = new Date().toISOString();
  const by = { verified_by: who.employee_id || null, verified_by_user: who.user_id || null, verified_by_name: who.name, verified_at: now };
  let patch;
  if (decision === 'ok') patch = { status: 'w_trasie', qty_counted: t.qty_declared, qty_loaded: t.qty_declared, started_at: now, ...by };
  else if (decision === 'accept') patch = { status: 'w_trasie', qty_counted: counted, qty_loaded: counted, started_at: now, ...by };
  else patch = { status: 'do_poprawy', qty_counted: counted, ...by };
  const u = await db.update('trips', tripId, patch);
  await savePhotos(tripId, 'wyjazd', photos, who);
  for (const n of await db.list('notifications', { eq: { trip_id: tripId } })) if (!n.read_at) await db.update('notifications', n.id, { read_at: now });
  return u;
}
async function verifyReturnCore(tripId, decision, counted, who, photos){
  const t = await db.get('trips', tripId);
  if (!t || t.status !== 'powrot') throw new Error('Ten kurs nie czeka już na sprawdzenie zwrotu.');
  if (decision !== 'ok' && !(counted >= 0)) throw new Error('Wpisz policzoną liczbę pojemników.');

  const by = { return_verified_by: who.employee_id || null, return_verified_by_user: who.user_id || null, return_verified_by_name: who.name, return_verified_at: now };
  let patch;
  if (decision === 'ok') patch = { status: 'zakonczony', qty_return_counted: t.qty_return_declared, qty_returned: t.qty_return_declared, finished_at: now, ...by };
  else if (decision === 'accept') patch = { status: 'zakonczony', qty_return_counted: counted, qty_returned: counted, finished_at: now, ...by };
  else patch = { status: 'powrot_poprawa', qty_return_counted: counted, ...by };
  const u = await db.update('trips', tripId, patch);

  for (const n of await db.list('notifications', { eq: { trip_id: tripId } })) if (!n.read_at) await db.update('notifications', n.id, { read_at: now });

}

    await notify('powrot', u, `${e.first_name} ${e.last_name} wrócił — sprawdź zwrot`, `Zgłasza zwrot ${p_qty_returned} pojemników`);
    return u;
  },
  async driver_return_resubmit({ p_token, p_trip_id, p_qty }){
    const { e, t } = await driverTrip(p_token, p_trip_id);
    if (t.status !== 'powrot_poprawa') throw new Error('Zwrot nie wymaga poprawy.');
    const u = await db.update('trips', t.id, { status: 'powrot', qty_return_declared: +p_qty || 0, returned_at: new Date().toISOString() });
    await notify('powrot', u, `${e.first_name} ${e.last_name} poprawił zwrot`, `Nowa deklaracja zwrotu: ${p_qty} pojemników`);
    return u;
  },
  async driver_back_to_route({ p_token, p_trip_id }){
    const { t } = await driverTrip(p_token, p_trip_id);
    if (!['powrot', 'powrot_poprawa'].includes(t.status)) throw new Error('Kurs nie czeka na sprawdzenie zwrotu.');
    const now = new Date().toISOString();
    for (const n of await db.list('notifications', { eq: { trip_id: t.id } })) if (!n.read_at) await db.update('notifications', n.id, { read_at: now });
    return db.update('trips', t.id, { status: 'w_trasie', qty_return_declared: null, qty_return_counted: null, returned_at: null });
  }
};

const api = {
  async all(){

  },
  saveRoute: r => r.id ? db.update('routes', r.id, { name: r.name, description: r.description }) : db.insert('routes', { name: r.name, description: r.description }),
  async removeRoute(id){

  // Odbiorca może być na kilku trasach — każde przypisanie ma własną kolejność na danej trasie
  async nextPos(routeId){ const st = await db.list('route_stops', { eq: { route_id: routeId } }); return st.reduce((m, x) => Math.max(m, x.position || 0), 0) + 1; },
  async addStop(routeId, cid){
    if ((await db.list('route_stops', { eq: { route_id: routeId, contractor_id: cid } })).length) return;
    return db.insert('route_stops', { route_id: routeId, contractor_id: cid, position: await api.nextPos(routeId) });
  },
  removeStop: id => db.remove('route_stops', id),
  setStopPos: (id, position) => db.update('route_stops', id, { position }),
  async setContractorRoutes(cid, routeIds){

    for (const st of cur) if (!routeIds.includes(st.route_id)) await db.remove('route_stops', st.id);
    for (const rid of routeIds) if (!cur.some(st => st.route_id === rid)) await api.addStop(rid, cid);
  },
  async saveContractor(c, opening){   // opening = { qty, pal } — stan początkowy pojemników i palet H1
    if (typeof opening === 'number') opening = { qty: opening, pal: 0 };
    const row = { type: c.type, nip: c.nip || null, regon: c.regon || null, name: c.name, street: c.street || null, postal_code: c.postal_code || null,
      city: c.city || null, phone: c.phone || null, email: c.email || null, notes: c.notes || null,
      uses_pallets: c.uses_pallets === undefined ? true : !!c.uses_pallets };
    const routeIds = c.type === 'odbiorca' ? (c.route_ids || (c.route_id ? [c.route_id] : [])) : [];
    if (c.id) {
      const saved = await db.update('contractors', c.id, row);
      if (c.route_ids !== undefined || c.type !== 'odbiorca') await api.setContractorRoutes(c.id, routeIds);
      return saved;
    }
    const saved = await db.insert('contractors', row);
    await api.setContractorRoutes(saved.id, routeIds);
    if (opening && (opening.qty || opening.pal)) await db.insert('movements', { contractor_id: saved.id, trip_id: null, employee_id: null, source: 'bilans',
      qty_out: c.type === 'odbiorca' ? Math.max(opening.qty || 0, 0) : 0, qty_in: c.type === 'dostawca' ? Math.max(opening.qty || 0, 0) : 0,
      pal_out: c.type === 'odbiorca' ? Math.max(opening.pal || 0, 0) : 0, pal_in: c.type === 'dostawca' ? Math.max(opening.pal || 0, 0) : 0, note: 'Bilans otwarcia',
      created_by: Auth.user ? Auth.user.id : null, created_by_name: Auth.user ? Auth.user.display_name : null });
    return saved;

  async removeContractor(id){
    if (db.kind === 'local') for (const m of await db.list('movements', { eq: { contractor_id: id } })) await db.remove('movements', m.id);
    if (db.kind === 'local') for (const st of await db.list('route_stops', { eq: { contractor_id: id } })) await db.remove('route_stops', st.id);

  async deleteTrip(id){

    // Supabase: link nadaje i zmienia baza (wyzwalacz), bo aplikacja nie widzi tokenów bez uprawnienia „Linki”

  async removeEmployee(id){

    : verifyCore(tripId, decision, counted, { employee_id: Auth.user.employee_id || null, user_id: Auth.user.id, name: Auth.user.display_name }, photos),
  tripPhotos: tripId => db.kind === 'supabase' ? db.list('trip_photos', { eq: { trip_id: tripId }, order: ['created_at', 'asc'] }) : PhotoStore.list(tripId),
  async markRead(id){ await db.update('notifications', id, { read_at: new Date().toISOString() }); }

/* ---------- Edycja wpisów z aplikacji głównej + dziennik zmian (edit_log) ---------- */
const mvFields = c => c && c.type === 'dostawca'
  ? [['qty_in', 'Pojemniki przyjęte od dostawcy'], ['qty_out', 'Pojemniki oddane dostawcy'], ['pal_in', 'Palety H1 przyjęte od dostawcy'], ['pal_out', 'Palety H1 oddane dostawcy'], ['note', 'Uwagi']]
  : [['qty_out', 'Pojemniki zostawione u klienta'], ['qty_in', 'Pojemniki zabrane od klienta'], ['pal_out', 'Palety H1 zostawione u klienta'], ['pal_in', 'Palety H1 zabrane od klienta'], ['note', 'Uwagi']];
const TRIP_FIELDS = [['qty_loaded', 'Wziął z firmy'], ['qty_returned', 'Zwrot na magazyn']];
const canEditMv = m => m.source === 'magazyn' ? can('magazyn') : can('kontrahenci_edit');
const me = () => ({ user_id: Auth.user.id, name: Auth.user.display_name });
async function editCore(table, id, fields, patch, reason, who){
  const row = await db.get(table, id);
  if (!row) throw new Error('Nie znaleziono wpisu.');
  const changes = [], upd = {};
  for (const [f, label] of fields) {
    if (!(f in patch)) continue;
    let nv = patch[f];
    if (f === 'created_at') {
      nv = dateFromInput(nv);
      if (Math.abs(new Date(nv) - new Date(row.created_at)) < 60000) continue;
      changes.push({ field: f, label, from: row.created_at, to: nv }); upd[f] = nv; continue;
    }
    if (f === 'note') nv = String(nv || '').trim() || null;
    else { if (nv === '' || nv == null) nv = null; else { nv = Math.round(Number(nv)); if (!(nv >= 0)) throw new Error(`„${label}” musi być liczbą 0 lub większą.`); } }
    const ov = row[f] ?? null;
    if (String(ov ?? '') !== String(nv ?? '')) { changes.push({ field: f, label, from: ov, to: nv }); upd[f] = nv; }
  }
  if (!changes.length) throw new Error('Nic nie zmieniono.');
  Object.assign(upd, { edited_at: new Date().toISOString(), edited_by: who.user_id, edited_by_name: who.name, edit_count: (row.edit_count || 0) + 1 });
  const saved = await db.update(table, id, upd);
  await db.insert('edit_log', { entity: table === 'movements' ? 'movement' : 'trip', entity_id: id, user_id: who.user_id, user_name: who.name, changes, reason: reason || null });
  return saved;
}
api.editMovement = async (id, patch, reason) => {
  if (db.kind === 'supabase') return db.rpc('staff_edit_movement', { p_id: id, p_qty_out: patch.qty_out, p_qty_in: patch.qty_in, p_pal_out: patch.pal_out, p_pal_in: patch.pal_in, p_note: patch.note, p_reason: reason || null,
    p_date: patch.created_at ? dateFromInput(patch.created_at) : null });
  const m = await db.get('movements', id), c = await db.get('contractors', m.contractor_id);
  if (!canEditMv(m)) throw new Error('Nie masz uprawnień do edycji tego wpisu.');
  const after = { ...m, ...patch };
  if (!hasQty(after)) throw new Error('Wpis musi mieć przynajmniej jedną liczbę większą od zera. Aby go usunąć, użyj „Usuń”.');
  const fields = mvFields(c).concat(DATED_SOURCES.includes(m.source) ? [['created_at', c.type === 'dostawca' ? 'Data dostawy' : 'Data']] : []);

  return editCore('movements', id, fields, patch, reason, me());
};
api.editTrip = async (id, patch, reason) => {

// „edytowano” — kto i kiedy (kliknięcie otwiera pełną historię zmian)

const fmtVal = v => v === null || v === undefined || v === '' ? '—' : typeof v === 'string' && isNaN(v) ? `„${v}”` : v;

// Data wpisu (np. data dostawy) — pole datetime-local ⇄ ISO
const pad2 = n => String(n).padStart(2, '0');
const toLocalInput = d => { const x = new Date(d); return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}T${pad2(x.getHours())}:${pad2(x.getMinutes())}`; };
function dateFromInput(v){
  if (!v) throw new Error('Podaj datę.');
  if (v === toLocalInput(new Date())) return new Date().toISOString();   // data domyślna (teraz) — zapisz dokładny moment
  const d = new Date(v);
  if (isNaN(d)) throw new Error('Nieprawidłowa data.');
  if (d.getTime() > Date.now() + 5 * 60000) throw new Error('Data nie może być z przyszłości.');
  return d.toISOString();
}
const DATED_SOURCES = ['magazyn', 'biuro'];   // wpisy z ręcznie ustawianą datą
// „wpisano …”, gdy wpis dodano z inną datą niż faktyczny moment wpisania
const enteredInfo = m => m.entered_at && Math.abs(new Date(m.entered_at) - new Date(m.created_at)) > 5 * 60000
  ? `<div class="small muted" title="Faktyczny moment wpisania do systemu">wpisano ${fmtDT(m.entered_at)}</div>` : '';

const CONF_DAYS = 30;   // po tylu dniach potwierdzenie uznajemy za stare
// saldo kontrahenta na koniec wybranego dnia (YYYY-MM-DD)
function balAsOf(c, day, movements){
  const sg = c.type === 'dostawca' ? -1 : 1;
  return movements.filter(m => m.contractor_id === c.id && localDate(m.created_at) <= day)
    .reduce((a, m) => ({ qty: a.qty + sg * (num(m.qty_out) - num(m.qty_in)), pal: a.pal + sg * (num(m.pal_out) - num(m.pal_in)) }), { qty: 0, pal: 0 });
}

const daysSince = day => Math.floor((new Date(localDate(new Date()) + 'T00:00') - new Date(day + 'T00:00')) / 86400000);
// czy kontrahent wymaga potwierdzenia: nigdy, dawno albo ostatnio niezgodne

api.addConfirmation = r => db.insert('balance_confirmations', { ...r, confirmed_by: Auth.user.id, confirmed_by_name: Auth.user.display_name });

function newToken(){
  const a = new Uint8Array(18); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');

// Hasła w trybie lokalnym: PBKDF2-SHA256 z solą (w Supabase hasłami zarządza Supabase Auth)
async function hashPassword(pwd, salt){
  if (!(crypto && crypto.subtle)) throw new Error('Logowanie wymaga bezpiecznego adresu (https lub localhost).');
  salt = salt || newToken().slice(0, 32);
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);
  return salt + ':' + Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
}
async function checkPassword(pwd, stored){ if (!stored) return false; return (await hashPassword(pwd, stored.split(':')[0])) === stored; }
function checkNewPassword(p, p2){
  if (!p || p.length < 8) throw new Error('Hasło musi mieć co najmniej 8 znaków.');
  if (p2 !== undefined && p !== p2) throw new Error('Hasła nie są takie same.');
}
async function adminFn(action, payload){   // Supabase: funkcja admin-users (wymaga klucza service_role po stronie serwera)
  const { data } = await db.client.auth.getSession();
  const r = await fetch(CONFIG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/admin-users', { method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.supabaseAnonKey, Authorization: 'Bearer ' + (data.session ? data.session.access_token : '') },
    body: JSON.stringify({ action, ...payload }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Serwer odrzucił operację.');
  return j;
}
api.users = {
  list: () => db.list('app_users', { order: ['display_name', 'asc'] }),
  async guardAdmins(id, patch){   // zawsze musi zostać aktywny administrator użytkowników
    const all = await api.users.list();
    const after = all.filter(u => !(patch === null && u.id === id)).map(u => u.id === id ? { ...u, ...patch } : u);
    if (!after.some(u => u.active && (u.permissions || []).includes('uzytkownicy')))
      throw new Error('Musi zostać przynajmniej jeden aktywny użytkownik z uprawnieniem „Użytkownicy”.');
  },
  async create(u){
    const email = u.email.trim().toLowerCase();
    if (u.employee_id && (await api.users.list()).some(x => x.employee_id === u.employee_id)) throw new Error('Ten pracownik ma już konto użytkownika.');
    checkNewPassword(u.password);
    const row = { display_name: u.display_name.trim(), email, employee_id: u.employee_id || null, permissions: u.permissions, active: u.active !== false };
    if (db.kind === 'supabase') return adminFn('create', { ...row, password: u.password });
    if ((await api.users.list()).some(x => x.email === email)) throw new Error('Użytkownik z tym e-mailem już istnieje.');
    return db.insert('app_users', { ...row, perm_v: 2, password_hash: await hashPassword(u.password), last_login_at: null });
  },
  async update(id, patch){
    if (patch.employee_id && (await api.users.list()).some(x => x.employee_id === patch.employee_id && x.id !== id)) throw new Error('Ten pracownik ma już konto użytkownika.');
    if (patch.email) {
      patch.email = patch.email.trim().toLowerCase();
      if ((await api.users.list()).some(x => x.email === patch.email && x.id !== id)) throw new Error('Użytkownik z tym e-mailem już istnieje.');
    }
    await api.users.guardAdmins(id, patch);
    if (db.kind === 'supabase') return adminFn('update', { id, ...patch });
    return db.update('app_users', id, { ...patch, perm_v: 2 });
  },
  async setPassword(id, pwd){
    checkNewPassword(pwd);
    if (db.kind === 'supabase') return adminFn('password', { id, password: pwd });
    return db.update('app_users', id, { password_hash: await hashPassword(pwd) });
  },
  async remove(id){
    if (Auth.user && Auth.user.id === id) throw new Error('Nie możesz usunąć własnego konta.');
    await api.users.guardAdmins(id, null);
    if (db.kind === 'supabase') return adminFn('delete', { id });
    return db.remove('app_users', id);
  },
  async changeOwnPassword(oldPwd, pwd, pwd2){
    checkNewPassword(pwd, pwd2);
    if (db.kind === 'supabase') {
      const chk = await db.client.auth.signInWithPassword({ email: Auth.user.email, password: oldPwd });
      if (chk.error) throw new Error('Obecne hasło jest nieprawidłowe.');
      const { error } = await db.client.auth.updateUser({ password: pwd }); if (error) throw new Error(error.message); return;
    }
    const me = await db.get('app_users', Auth.user.id);
    if (!(await checkPassword(oldPwd, me.password_hash))) throw new Error('Obecne hasło jest nieprawidłowe.');
    await db.update('app_users', me.id, { password_hash: await hashPassword(pwd) });
  }
};

   ===================================================================== */
function validNip(nip){
  if (!/^\d{10}$/.test(nip)) return false;
  const w = [6,5,7,2,3,4,5,6,7];
  const s = w.reduce((a, x, i) => a + x * +nip[i], 0) % 11;
  return s !== 10 && s === +nip[9];
}
function splitAddress(addr){
  if (!addr) return {};
  const m = addr.match(/^(.*?),?\s*(\d{2}-\d{3})\s+(.+)$/);
  return m ? { street: m[1].replace(/,\s*$/, ''), postal_code: m[2], city: m[3] } : { street: addr };
}
async function lookupNip(raw){
  const nip = String(raw || '').replace(/\D/g, '');
  if (!validNip(nip)) throw new Error('Ten NIP ma błędną sumę kontrolną. Sprawdź cyfry.');
  if (CONFIG.gusFunctionUrl) {        // docelowo: funkcja Supabase → API GUS (BIR)
    const headers = { 'Content-Type': 'application/json' };
    if (db.kind === 'supabase') {
      headers.apikey = CONFIG.supabaseAnonKey;
      const { data } = await db.client.auth.getSession();
      if (data.session) headers.Authorization = 'Bearer ' + data.session.access_token;
    }
    const r = await fetch(CONFIG.gusFunctionUrl, { method: 'POST', headers, body: JSON.stringify({ nip }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'GUS nie odpowiedział. Spróbuj za chwilę.');
    return j;
  }
  // tymczasowo: publiczny Wykaz podatników VAT (Ministerstwo Finansów)
  let r;
  try { r = await fetch(`https://wl-api.mf.gov.pl/api/search/nip/${nip}?date=${new Date().toISOString().slice(0, 10)}`); }
  catch(e){ throw new Error('Nie można połączyć się z rejestrem w tym środowisku. Wpisz dane ręcznie — po wdrożeniu funkcji GUS pobieranie zadziała.'); }
  const j = await r.json().catch(() => ({}));
  const s = j && j.result && j.result.subject;
  if (!s) throw new Error('Nie znaleziono firmy o tym NIP w rejestrze.');
  return { nip, regon: s.regon || '', name: s.name, ...splitAddress(s.workingAddress || s.residenceAddress) };
}

function closeModal(){ $('#modal').innerHTML = ''; }
function modal({ title, body, submit, onSubmit, wide, extra }){
  $('#modal').innerHTML = `<div class="mb" data-close><form class="md ${wide ? 'wide' : ''}" novalidate>
    <header><h2>${esc(title)}</h2><button type="button" class="btn ghost" data-close aria-label="Zamknij">✕</button></header>
    <div class="bd">${body}<p class="err" id="merr"></p></div>
    ${onSubmit || extra ? `<footer>${extra || ''}<button type="button" class="btn" data-close>${onSubmit ? 'Anuluj' : 'Zamknij'}</button>${onSubmit ? `<button class="btn pri" type="submit">${esc(submit || 'Zapisz')}</button>` : ''}</footer>` : ''}
  </form></div>`;
  const form = $('#modal form');
  $('#modal .mb').addEventListener('mousedown', e => { if (e.target.hasAttribute('data-close')) closeModal(); });
  form.querySelectorAll('button[data-close]').forEach(b => b.onclick = closeModal);
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (!onSubmit) return;
    const data = Object.fromEntries(new FormData(form).entries());
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    try { await onSubmit(data, form); } catch(err){ $('#merr').textContent = err.message; console.error(err); }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
  const first = form.querySelector('input:not([type=radio]):not([type=hidden]),select,textarea'); if (first) setTimeout(() => first.focus(), 30);
  return form;
}
function confirmBox(title, text, label = 'Usuń'){
  return new Promise(res => {
    modal({ title, body: `<p>${esc(text)}</p>`, submit: label, onSubmit: async () => { closeModal(); res(true); } });
    $('#modal .mb').addEventListener('mousedown', e => { if (e.target.hasAttribute('data-close')) res(false); });
  });
}
let audioCtx = null;
function unlockAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
document.addEventListener('pointerdown', unlockAudio, { once: true });   // przeglądarki wymagają dotknięcia, zanim zagrają dźwięk
function beep(){
  try {
    unlockAudio(); const ctx = audioCtx;
    [0, .35].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(.18, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .3); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .3);
    });
  } catch(e){}
}

function scheduleRender(){
  // ekranu logowania / pierwszego uruchomienia nie odświeżamy w tle — inaczej czyściłby wpisywany e-mail i hasło
  if ($('#authform') && !['k', 'm'].includes(parseHash().page)) return;
  // odświeżanie wstrzymujemy tylko podczas wpisywania tekstu/liczby — nie przy zaznaczonej trasie, checkboxie itp.
  const a = document.activeElement;
  const typing = a && a.closest('#app') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' ||

async function render(){

        <div class="foot"><div class="me"><b>${esc(Auth.user.display_name)}</b><span>${esc(roleName(Auth.user.permissions))}</span></div>
          <div class="row" style="gap:4px"><button class="btn sm" data-act="my-pass">Zmień hasło</button><button class="btn sm" data-act="logout">Wyloguj</button></div>
          ${can('magazyn') && 'Notification' in window && Notification.permission === 'default' ? '<button class="btn sm" data-act="notif-perm" style="margin-top:6px">🔔 Włącz powiadomienia</button>' : ''}
          <p style="margin:10px 0 0">${db.kind === 'local' ? 'Dane zapisane w tej przeglądarce' : 'Dane w chmurze (Supabase)'}</p></div>
      </aside>
      <main class="main">${target ? approvalsHtml() : ''}${await fn(arg)}</main></div>`;
    if (wasOpen) $('.shell').classList.remove('open');
    if (S.keepScroll) window.scrollTo(0, y);
    S.keepScroll = false;
  } catch(e){
    console.error(e);
    $('#app').innerHTML = `<div class="drv"><h1>Coś poszło nie tak</h1><p class="sub">${esc(e.message)}</p><a class="btn" href="#/">Wróć do aplikacji</a></div>`;
  } finally {
    rendering = false;
    if (renderPending) { renderPending = false; scheduleRender(); }
  }
}

/* ---------------- Powiadomienia dla magazynu ---------------- */
function checkNotifications(){
  const list = S.data.notifications.filter(n => n.target_position === 'magazynier' && !n.read_at);
  const newest = list.reduce((m, n) => n.created_at > m ? n.created_at : m, '');
  if (S.seenNotif === null) { S.seenNotif = newest; return; }
  const fresh = list.filter(n => n.created_at > S.seenNotif);
  if (fresh.length) {
    S.seenNotif = newest;
    beep();
    fresh.forEach(n => {
      toast(n.title + ' — ' + n.body, 'warn');
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification(n.title, { body: n.body }); } catch(e){}
    });
  }
}

// Prośby kierowców o zatwierdzenie wyjazdu/powrotu — pokazywane nad każdą stroną, gdy ktoś czeka
function approvalsHtml(){
  if (!can('magazyn') || !S.data) return '';
  const d = S.data;
  const route = id => (d.routes.find(r => r.id === id) || {}).name || '—';
  const emp = id => d.employees.find(e => e.id === id);
  const waiting = d.trips.filter(t => t.status === 'oczekuje').sort((a, b) => a.created_at.localeCompare(b.created_at));
  const fix = d.trips.filter(t => t.status === 'do_poprawy' || t.status === 'powrot_poprawa');
  const returning = d.trips.filter(t => t.status === 'powrot').sort((a, b) => (a.returned_at || '').localeCompare(b.returned_at || ''));
  const reqCount = waiting.length + returning.length;
  const tripMv = t => d.movements.filter(m => m.trip_id === t.id);
  if (!reqCount && !fix.length) return '';
  return `<section class="panel" style="margin-bottom:20px;${reqCount ? 'border-color:var(--amber);background:var(--amber-soft)' : ''}">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Prośby o zatwierdzenie (${reqCount})</h2><span class="small muted">Zatwierdzasz jako <b style="color:var(--ink)">${esc(Auth.user.display_name)}</b></span></div>
    ${reqCount ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">${returning.map(t => {
      const mv = tripMv(t), exp = num(t.qty_loaded) - mv.reduce((a, m) => a + num(m.qty_out), 0) + mv.reduce((a, m) => a + num(m.qty_in), 0), diff = num(t.qty_return_declared) - exp;
      return `<div class="card wait" style="margin:0">
      <div class="row" style="justify-content:space-between"><b>${esc(fullName(emp(t.driver_id)))}</b><span class="pill p-amber">Powrót z trasy · ${fmtT(t.returned_at)}</span></div>
      <div class="muted small">${esc(tripRouteName(t))} · wizyt: ${mv.length}</div>
      <div class="bigbal" style="margin:10px 0 4px"><b>${t.qty_return_declared}</b><span class="muted">pojemników zwraca kierowca</span></div>
      <div class="small" style="margin-bottom:10px">Według wpisów powinno być <b>${exp}</b>${diff ? ` <span style="color:var(--red)">(różnica ${diff > 0 ? '+' : ''}${diff})</span>` : ''}</div>
      <div class="row"><button class="btn ok" data-act="return-ok" data-id="${t.id}">Zwrot się zgadza</button><button class="btn bad" data-act="return-bad" data-id="${t.id}">Nie zgadza się</button></div>
    </div>`; }).join('')}${waiting.map(t => `<div class="card wait" style="margin:0">
      <div class="row" style="justify-content:space-between"><b>${esc(fullName(emp(t.driver_id)))}</b><span class="pill p-blue">Wyjazd · ${fmtT(t.created_at)}</span></div>
      <div class="muted small">${esc(tripRouteName(t))}</div>
      <div class="bigbal" style="margin:10px 0"><b>${t.qty_declared}</b><span class="muted">pojemników deklaruje kierowca</span></div>
      <div class="row"><button class="btn ok" data-act="verify-ok" data-id="${t.id}">Ilość się zgadza</button><button class="btn bad" data-act="verify-bad" data-id="${t.id}">Nie zgadza się</button></div>
    </div>`).join('')}</div>` : '<p class="muted" style="margin:0">Nikt nie czeka. Gdy kierowca zgłosi wyjazd albo powrót z trasy, prośba pojawi się tutaj i usłyszysz sygnał.</p>'}
    ${fix.length ? `<p class="small" style="margin:14px 0 0"><b>Odesłane do poprawy:</b> ${fix.map(t => t.status === 'powrot_poprawa' ? `${esc(fullName(emp(t.driver_id)))} — zwrot (zgłosił ${t.qty_return_declared}, policzono ${t.qty_return_counted})` : `${esc(fullName(emp(t.driver_id)))} — wyjazd (zadeklarował ${t.qty_declared}, policzono ${t.qty_counted})`).join('; ')}</p>` : ''}
  </section>`;
}

async function pgDashboard(){
  const d = S.data, bm = balances(d.movements);
  const route = id => (d.routes.find(r => r.id === id) || {}).name || '—';
  const emp = id => d.employees.find(e => e.id === id);
  const cName = id => (d.contractors.find(c => c.id === id) || {}).name || '—';
  const canW = can('magazyn'), canC = can('kontrahenci_view');
  const recv = d.contractors.filter(c => c.type === 'odbiorca'), sup = d.contractors.filter(c => c.type === 'dostawca').sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  const waiting = d.trips.filter(t => t.status === 'oczekuje').sort((a, b) => a.created_at.localeCompare(b.created_at));
  const fix = d.trips.filter(t => t.status === 'do_poprawy' || t.status === 'powrot_poprawa');
  const returning = d.trips.filter(t => t.status === 'powrot').sort((a, b) => (a.returned_at || '').localeCompare(b.returned_at || ''));
  const reqCount = waiting.length + returning.length;
  const tripMv = t => d.movements.filter(m => m.trip_id === t.id);
  const road = d.trips.filter(t => t.status === 'w_trasie');
  const atCustomers = recv.reduce((a, c) => a + Math.max(balOf(bm, c), 0), 0);
  const ofSuppliers = sup.reduce((a, c) => a + Math.max(balOf(bm, c), 0), 0);
  const oursAtSuppliers = sup.reduce((a, c) => a + Math.max(-balOf(bm, c), 0), 0);   // saldo dostawcy na minusie
  const supMinus = sup.filter(c => balOf(bm, c) < 0).length;
  const palAtCustomers = recv.reduce((a, c) => a + Math.max(palOf(bm, c), 0), 0);
  const palOfSuppliers = sup.reduce((a, c) => a + Math.max(palOf(bm, c), 0), 0);
  const palOursAtSuppliers = sup.reduce((a, c) => a + Math.max(-palOf(bm, c), 0), 0);
  const top = recv.map(c => ({ c, b: balOf(bm, c), p: palOf(bm, c) })).filter(x => x.b > 0 || x.p > 0).sort((a, b) => b.b - a.b || b.p - a.p).slice(0, 8);
  const recent = d.movements.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 8);
  const supRecent = d.movements.filter(m => sup.some(s => s.id === m.contractor_id)).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 5);
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const goC = id => canC ? `class="click" data-go="#/kontrahent/${id}"` : '';

  if (!d.contractors.length && !d.employees.length) return `<h1>Pulpit</h1><p class="sub">Zacznij od dodania kontrahentów, tras i pracowników.</p>
    <div class="panel empty"><p>Baza jest pusta. Możesz dodać dane ręcznie albo wczytać przykładowe, żeby zobaczyć jak działa aplikacja.</p>
    <div class="row" style="justify-content:center">${can('kontrahenci_edit') ? '<a class="btn pri" href="#/kontrahenci">Dodaj kontrahenta</a>' : ''}${can('ustawienia') && db.kind === 'local' ? '<button class="btn" data-act="seed">Wczytaj dane przykładowe</button>' : ''}</div></div>`;

  return `<div class="head"><div><h1>Pulpit</h1><p class="sub">${new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}</p></div>
    ${canW ? `<div class="row"><span class="muted">Zatwierdzasz jako <b style="color:var(--ink)">${esc(Auth.user.display_name)}</b></span>
      ${perm === 'default' ? '<button class="btn" data-act="notif-perm">Włącz powiadomienia</button>' : ''}</div>` : ''}</div>
  ${palViewBar()}

  

  <div class="stats">
    <div class="stat"><b>${atCustomers}</b><span>odbiorcy <b style="font-size:inherit;display:inline;color:var(--red)">wiszą nam</b> pojemników</span></div>
    <div class="stat"><b>${ofSuppliers}</b><span>my <b style="font-size:inherit;display:inline;color:var(--green)">wisimy</b> dostawcom pojemników</span></div>
    <div class="stat"><b style="color:${oursAtSuppliers ? 'var(--red)' : 'inherit'}">${oursAtSuppliers}</b><span>dostawcy <b style="font-size:inherit;display:inline;color:var(--red)">wiszą nam</b> pojemników${supMinus ? ` (${supMinus} ${supMinus === 1 ? 'dostawca' : 'dostawców'} na minusie)` : ''}</span></div>
    <div class="stat"><b>${road.length}</b><span>kierowców w trasie</span></div>
    <div class="stat"><b style="color:${reqCount ? 'var(--amber)' : 'inherit'}">${reqCount}</b><span>czeka na zatwierdzenie</span></div>
  </div>
  ${S.showPal ? `<div class="stats pal">
    <div class="stat"><b>${palAtCustomers}</b><span>odbiorcy wiszą nam palet H1</span></div>
    <div class="stat"><b>${palOfSuppliers}</b><span>wisimy dostawcom palet H1</span></div>
    <div class="stat"><b style="color:${palOursAtSuppliers ? 'var(--red)' : 'inherit'}">${palOursAtSuppliers}</b><span>dostawcy wiszą nam palet H1</span></div>
  </div>` : ''}

  <div class="grid g2" style="margin-bottom:16px">
    <div class="panel"><h2>W trasie (${road.length})</h2>
      ${road.length ? road.map(t => {

async function pgContractors(){
  const d = S.data, bm = balances(d.movements);
  const route = id => (d.routes.find(r => r.id === id) || {}).name;
  const q = S.kq.toLowerCase();
  let list = d.contractors.filter(c => S.ktab === 'all' || c.type === S.ktab)
    .filter(c => !q || [c.name, c.nip, c.city].some(v => String(v || '').toLowerCase().includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  const cnt = t => d.contractors.filter(c => t === 'all' || c.type === t).length;
  // sortowanie po saldzie: brak → od największego „wiszą nam” → odwrotnie → brak (kolejność alfabetyczna)
  const owedKey = c => { const v = (S.showPal ? palOf : balOf)(bm, c); const o = owe(v, c.type); return o.theyOwe === null ? 0 : o.theyOwe ? o.n : -o.n; };
  if (S.ksort) list = list.slice().sort((a, b) => (S.ksort === 'desc' ? owedKey(b) - owedKey(a) : owedKey(a) - owedKey(b)) || a.name.localeCompare(b.name, 'pl'));
  const toConfirm = list.filter(needsConf).length;
  // podsumowanie sald wszystkich kontrahentów (wg wybranego widoku: pojemniki albo palety H1)
  const balFn = S.showPal ? palOf : balOf, U = S.showPal ? 'palet H1' : 'pojemników';
  const agg = (type, sign) => { const xs = d.contractors.filter(c => c.type === type && (!S.showPal || palOn(c) || palOf(bm, c))).map(c => balFn(bm, c)).filter(v => sign > 0 ? v > 0 : v < 0);
    return { sum: Math.abs(xs.reduce((a, v) => a + v, 0)), n: xs.length }; };
  const rOwe = agg('odbiorca', 1), weOweR = agg('odbiorca', -1), weOweS = agg('dostawca', 1), sOwe = agg('dostawca', -1);
  const net = rOwe.sum + sOwe.sum - weOweR.sum - weOweS.sum;
  const who = (n, one, few, many) => `${n} ${n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many}`;
  const W = (txt, col) => `<b style="font-size:inherit;display:inline;color:var(--${col})">${txt}</b>`;
  const tile = (v, col, label, sub, bg) => `<div class="stat"${bg ? ' style="background:var(--panel2)"' : ''}><b style="color:${v ? `var(--${col})` : 'inherit'}">${v}</b><span>${label}<br><span class="small">${sub}</span></span></div>`;
  const summary = `<div class="stats" style="margin-bottom:18px">
    ${tile(rOwe.sum, 'red', `Odbiorcy ${W('wiszą nam', 'red')}`, who(rOwe.n, 'odbiorca', 'odbiorców', 'odbiorców'))}
    ${tile(weOweS.sum, 'green', `${W('Wisimy', 'green')} dostawcom`, who(weOweS.n, 'dostawca', 'dostawców', 'dostawców'))}
    ${tile(sOwe.sum, 'red', `Dostawcy ${W('wiszą nam', 'red')}`, who(sOwe.n, 'dostawca', 'dostawców', 'dostawców'))}
    ${tile(weOweR.sum, 'green', `${W('Wisimy', 'green')} odbiorcom`, who(weOweR.n, 'odbiorca', 'odbiorców', 'odbiorców'))}
    ${tile(Math.abs(net), net > 0 ? 'red' : 'green', net > 0 ? `Bilans: ${W('wiszą nam', 'red')}` : net < 0 ? `Bilans: ${W('wisimy', 'green')}` : 'Bilans: rozliczone', `${U}, łącznie (wiszą nam − wisimy)`, true)}
  </div>`;
  if (S.kconf) list = list.filter(needsConf);
  return `<div class="head"><div><h1>Kontrahenci</h1><p class="sub">Odbiorcy i dostawcy z rejestrem pojemników</p></div>${can('kontrahenci_edit') ? '<button class="btn pri" data-act="c-new">Dodaj kontrahenta</button>' : ''}</div>
  ${palViewBar()}
  ${d.contractors.length ? summary : ''}
  <div class="row" style="margin-bottom:14px;justify-content:space-between">
    <div class="tabs">${[['odbiorca', 'Odbiorcy'], ['dostawca', 'Dostawcy'], ['all', 'Wszyscy']].map(([k, l]) => `<button data-act="ktab" data-v="${k}" class="${S.ktab === k ? 'on' : ''}">${l} (${cnt(k)})</button>`).join('')}</div>
    <div class="row" style="gap:8px">
      <button class="btn ${S.kconf ? 'pri' : ''}" data-act="kconf" title="Nigdy niepotwierdzone, starsze niż ${CONF_DAYS} dni albo niezgodne">Do potwierdzenia salda (${toConfirm})</button>
      <input class="search" type="search" placeholder="Szukaj: nazwa, NIP, miasto" value="${esc(S.kq)}" data-input="kq">
    </div>
  </div>
  ${list.length ? `<div class="tw"><table class="one" style="min-width:600px"><thead><tr><th>Nazwa</th><th>Miejscowość</th><th>${S.ktab === 'dostawca' ? 'Rodzaj' : 'Trasa'}</th>${sixHead(S.ktab === 'dostawca' ? 'sup' : S.ktab === 'odbiorca' ? 'rec' : 'all').replace('<th class="num">Saldo</th>',
      `<th class="num"><button type="button" class="sortbtn ${S.ksort ? 'on' : ''}" data-act="ksort" title="${S.ksort === 'desc' ? 'Od największego „wiszą nam” — kliknij, aby odwrócić' : S.ksort === 'asc' ? 'Od największego „wisimy” — kliknij, aby wyłączyć sortowanie' : 'Sortuj według salda'}">Saldo <span>${S.ksort === 'desc' ? '▼' : S.ksort === 'asc' ? '▲' : '↕'}</span></button></th>`)}<th>Potwierdzenie salda</th></tr></thead><tbody>
    ${list.map(c => `<tr class="click" data-go="#/kontrahent/${c.id}"><td><b class="cut" style="max-width:180px" title="${esc(c.name)}${c.nip ? ' · NIP ' + esc(c.nip) : ''}">${esc(c.name)}</b>${S.showPal && palOn(c) ? ' <span class="pill p-grey" title="Uczestniczy w obrocie paletami H1">H1</span>' : ''}</td><td><span class="cut" style="max-width:100px" title="${esc(c.city || '')}">${esc(c.city || '—')}</span></td>
      <td>${c.type === 'dostawca' ? '<span class="pill p-grey">Dostawca</span>' : ((rs => rs.length ? `<span class="cut" style="max-width:120px" title="${esc(rs.map(r => r.name).join(', '))}">${esc(rs.map(r => r.name).join(', '))}</span>` : '<span class="muted">bez trasy</span>')(routesOfC(c.id)))}</td>${sixCells(totOf(bm, c), S.ktab === 'dostawca' ? 'sup' : 'rec', c.type, palOn(c))}<td style="white-space:nowrap">${confCell(c, bm)}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="panel empty">${S.kconf ? 'Wszystkie salda w tej grupie są aktualnie potwierdzone.' : q ? 'Nic nie pasuje do wyszukiwania.' : 'Brak kontrahentów w tej grupie.'}${can('kontrahenci_edit') ? '<br><button class="btn pri" data-act="c-new">Dodaj kontrahenta</button>' : ''}</div>`}`;
}

// Przełącznik widoku: domyślnie same pojemniki, palety H1 po włączeniu (zapamiętywane na tym urządzeniu)
function palViewBar(){
  return `<div class="viewbar"><span class="small muted">Widok:</span><div class="tabs">
    <button data-act="pal-view" data-v="0" class="${S.showPal ? '' : 'on'}">📦 Pojemniki</button>
    <button data-act="pal-view" data-v="1" class="${S.showPal ? 'on' : ''}">🪵 Palety H1</button></div></div>`;
}
function filterBtn(key, count){
  const open = S[key + 'Open'];
  return `<button class="btn ${open ? '' : (count ? 'pri' : '')}" data-act="f-toggle" data-v="${key}" aria-expanded="${open ? 'true' : 'false'}">${open ? 'Ukryj filtry' : 'Filtruj'}${count && !open ? ` <span class="badge" style="background:#fff;color:var(--crate)">${count}</span>` : ''}</button>`;
}
function activeFilters(key, items, clearAct){
  if (S[key + 'Open'] || !items.length) return '';
  return `<div class="row" style="gap:6px;margin-bottom:16px"><span class="small muted">Filtry:</span>${items.map(t => `<span class="pill p-blue">${esc(t)}</span>`).join('')}
    <button class="btn sm ghost" data-act="${clearAct}">Wyczyść</button></div>`;
}
const fmtD = v => v ? new Date(v + 'T00:00').toLocaleDateString('pl-PL') : '';
const rangeLabel = (a, b) => a && b ? (a === b ? fmtD(a) : `${fmtD(a)} – ${fmtD(b)}`) : a ? `od ${fmtD(a)}` : b ? `do ${fmtD(b)}` : '';

const localDate = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
function datePreset(p){
  const now = new Date(), day = localDate(now);
  if (p === 'dzis') return [day, day];
  if (p === 'wczoraj') { const y = new Date(now); y.setDate(y.getDate() - 1); const v = localDate(y); return [v, v]; }
  if (p === 'tydzien') { const m = new Date(now); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return [localDate(m), day]; }
  if (p === 'miesiac') return [localDate(new Date(now.getFullYear(), now.getMonth(), 1)), day];
  if (p === 'pmiesiac') return [localDate(new Date(now.getFullYear(), now.getMonth() - 1, 1)), localDate(new Date(now.getFullYear(), now.getMonth(), 0))];
  return ['', ''];
}
async function pgTrips(){
  const d = S.data, F = S.tf || (S.tf = { route: '', driver: '', from: '', to: '', status: '' });
  const emp = id => d.employees.find(e => e.id === id);
  const route = id => (d.routes.find(r => r.id === id) || {}).name || '—';
  const all = d.trips.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
  const list = all.filter(t => {
    const day = localDate(t.started_at || t.created_at);
    return (!F.route || tripRouteIds(t).includes(F.route)) && (!F.driver || t.driver_id === F.driver) && (!F.status || t.status === F.status)
      && (!F.from || day >= F.from) && (!F.to || day <= F.to);
  });
  // listy do filtrów: wszyscy kierowcy i trasy, także z historii (np. nieaktywni)
  const drivers = d.employees.filter(e => e.position === 'kierowca' || all.some(t => t.driver_id === e.id)).sort((a, b) => fullName(a).localeCompare(fullName(b), 'pl'));
  const routes = d.routes.slice().sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  const active = Object.values(F).some(Boolean);
  const rows = list.map(t => {
    const mv = d.movements.filter(m => m.trip_id === t.id);
    const out = mv.reduce((a, m) => a + num(m.qty_out), 0), inn = mv.reduce((a, m) => a + num(m.qty_in), 0);
    const pout = mv.reduce((a, m) => a + num(m.pal_out), 0), pin = mv.reduce((a, m) => a + num(m.pal_in), 0);
    return { t, out, inn, pout, pin, exp: num(t.qty_loaded) - out + inn };
  });
  const done = rows.filter(r => r.t.status === 'zakonczony');
  const sum = f => rows.reduce((a, r) => a + f(r), 0);
  const diffs = done.filter(r => num(r.t.qty_returned) !== r.exp).length;
  const presets = [['dzis', 'Dziś'], ['wczoraj', 'Wczoraj'], ['tydzien', 'Ten tydzień'], ['miesiac', 'Ten miesiąc'], ['pmiesiac', 'Poprzedni miesiąc']];
  const curPreset = (presets.find(([k]) => { const [a, b] = datePreset(k); return a === F.from && b === F.to && a; }) || [])[0];
  const tags = [F.route && (d.routes.find(r => r.id === F.route) || {}).name, F.driver && fullName(emp(F.driver)),
    rangeLabel(F.from, F.to), F.status && STATUS[F.status][0]].filter(Boolean);
  return `<div class="head"><div><h1>Kursy</h1><p class="sub">Historia wyjazdów kierowców</p></div>${filterBtn('tf', tags.length)}</div>
  ${palViewBar()}
  ${activeFilters('tf', tags, 'tf-clear')}
  ${S.tfOpen ? `<div class="panel" style="margin-bottom:16px">
    <div class="f" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <label class="l">Trasa<select data-change="tf" data-k="route"><option value="">Wszystkie trasy</option>${routes.map(r => `<option value="${r.id}" ${r.id === F.route ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
      <label class="l">Kierowca<select data-change="tf" data-k="driver"><option value="">Wszyscy kierowcy</option>${drivers.map(e => `<option value="${e.id}" ${e.id === F.driver ? 'selected' : ''}>${esc(fullName(e))}${e.active ? '' : ' (nieaktywny)'}</option>`).join('')}</select></label>
      <label class="l">Od dnia<input type="date" data-change="tf" data-k="from" value="${F.from}" max="${F.to || ''}"></label>
      <label class="l">Do dnia<input type="date" data-change="tf" data-k="to" value="${F.to}" min="${F.from || ''}"></label>
      <label class="l">Status<select data-change="tf" data-k="status"><option value="">Wszystkie</option>${Object.entries(STATUS).map(([k, [l]]) => `<option value="${k}" ${k === F.status ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <div class="row" style="gap:6px">${presets.map(([k, l]) => `<button class="btn sm ${curPreset === k ? 'pri' : ''}" data-act="tf-preset" data-v="${k}">${l}</button>`).join('')}</div>
      ${active ? '<button class="btn sm ghost" data-act="tf-clear">Wyczyść filtry</button>' : ''}
    </div>
  </div>` : ''}
  ${all.length ? `
  <div class="stats">
    <div class="stat"><b>${list.length}</b><span>${active ? `kursów spełnia filtry (z ${all.length})` : 'wszystkich kursów'}</span></div>
    ${S.showPal ? `
    <div class="stat"><b>${sum(r => r.pout)}</b><span>palet H1 zostawionych u klientów</span></div>
    <div class="stat"><b>${sum(r => r.pin)}</b><span>palet H1 zabranych od klientów</span></div>
    <div class="stat"><b style="color:${sum(r => r.pout - r.pin) > 0 ? 'var(--red)' : sum(r => r.pout - r.pin) < 0 ? 'var(--green)' : 'inherit'}">${sum(r => r.pout - r.pin)}</b><span>saldo palet H1 (zostawione − zabrane)</span></div>` : `
    <div class="stat"><b>${sum(r => num(r.t.qty_loaded))}</b><span>pojemników zabranych z firmy</span></div>
    <div class="stat"><b>${sum(r => r.out)}</b><span>zostawionych u klientów</span></div>
    <div class="stat"><b>${sum(r => r.inn)}</b><span>zabranych od klientów</span></div>
    <div class="stat"><b style="color:${sum(r => r.out - r.inn) > 0 ? 'var(--red)' : sum(r => r.out - r.inn) < 0 ? 'var(--green)' : 'inherit'}">${sum(r => r.out - r.inn)}</b><span>saldo (zostawione − zabrane)</span></div>
    <div class="stat"><b style="color:${diffs ? 'var(--red)' : 'inherit'}">${diffs}</b><span>kursów z różnicą przy zwrocie</span></div>`}
  </div>
  ${false ? `<div class="stats pal">
    <div class="stat"><b>${sum(r => r.pout)}</b><span>palet H1 zostawionych u klientów</span></div>
    <div class="stat"><b>${sum(r => r.pin)}</b><span>palet H1 zabranych od klientów</span></div>
    <div class="stat"><b style="color:${sum(r => r.pout - r.pin) > 0 ? 'var(--red)' : sum(r => r.pout - r.pin) < 0 ? 'var(--green)' : 'inherit'}">${sum(r => r.pout - r.pin)}</b><span>saldo palet H1 (zostawione − zabrane)</span></div>
  </div>` : ''}
  ${list.length ? `<div class="tw"><table style="min-width:600px"><thead><tr><th>Wyjazd</th><th>Kierowca</th><th>Trasa</th>${S.showPal ? '' : '<th class="num">Wziął z firmy</th>'}${sixHead('rec')}${S.showPal ? '' : '<th class="num">Zwrot poj. (oczek.)</th>'}<th>Status</th></tr></thead><tbody>
    ${rows.map(({ t, out, inn, pout, pin, exp }) => {
      const diff = t.status === 'zakonczony' && num(t.qty_returned) !== exp;
      return `<tr class="click" data-act="trip" data-id="${t.id}"><td>${fmtDT(t.started_at || t.created_at)}</td><td>${esc(fullName(emp(t.driver_id)))}</td><td>${esc(tripRouteName(t))}</td>
        ${S.showPal ? '' : `<td class="num">${t.qty_loaded ?? t.qty_declared}</td>`}${sixCells({ out, in: inn, pout, pin }, 'rec', 'odbiorca', true, true)}
        ${S.showPal ? '' : `<td class="num">${t.status === 'zakonczony' ? `<span class="${diff ? 'bal pos' : ''}">${t.qty_returned}</span> <span class="muted">(${exp})</span>` : '—'}</td>`}<td>${statusPill(t.status)}${t.edit_count || d.movements.some(m => m.trip_id === t.id && m.edit_count) ? ' <span class="pill p-amber" title="Kurs lub jego wizyty były edytowane">✎</span>' : ''}</td></tr>`; }).join('')}
  </tbody><tfoot><tr><td colspan="3">Razem (${rows.length})</td>${S.showPal ? '' : `<td class="num">${sum(r => num(r.t.qty_loaded))}</td>`}${sixCells({ out: sum(r => r.out), in: sum(r => r.inn), pout: sum(r => r.pout), pin: sum(r => r.pin) }, 'rec', 'odbiorca', true, true)}${S.showPal ? '' : `<td class="num">${done.reduce((a, r) => a + num(r.t.qty_returned), 0)}</td>`}<td></td></tr></tfoot></table></div>` : '<div class="panel empty">Żaden kurs nie pasuje do wybranych filtrów.<br><button class="btn" data-act="tf-clear">Wyczyść filtry</button></div>'}`
  : '<div class="panel empty">Nie było jeszcze żadnego kursu. Kierowca rozpoczyna kurs swoim linkiem z zakładki Kadry.</div>'}`;
}

function userForm(u, users = []){
  const isNew = !u.id;
  // wszyscy pracownicy z Kadr, niezależnie od stanowiska; jeden pracownik = jedno konto
  const staff = S.data.employees.slice().sort((a, b) => fullName(a).localeCompare(fullName(b), 'pl'));
  const takenBy = id => users.find(x => x.employee_id === id && x.id !== u.id);
  const has = p => (u.permissions || []).includes(p);
  const self = Auth.user && u.id === Auth.user.id;
  const f = modal({ title: isNew ? 'Nowy użytkownik' : 'Użytkownik — ' + u.display_name, submit: isNew ? 'Dodaj użytkownika' : 'Zapisz zmiany', wide: true, body: `
    <div class="f">
      <label class="l">Imię i nazwisko *<input name="display_name" value="${esc(u.display_name || '')}"></label>
      <label class="l">E-mail (login) *<input name="email" type="email" autocomplete="off" value="${esc(u.email || '')}"></label>
      ${isNew ? `<label class="l">Hasło *<input name="p1" type="password" autocomplete="new-password" placeholder="min. 8 znaków"></label>
        <label class="l">Powtórz hasło *<input name="p2" type="password" autocomplete="new-password"></label>` : ''}
      <label class="l full">Powiązany pracownik<select name="employee_id"><option value="">— brak —</option>${Object.entries(POS).map(([pos, label]) => {
          const group = staff.filter(e => e.position === pos);
          return group.length ? `<optgroup label="${label}">${group.map(e => { const t = takenBy(e.id);
            return `<option value="${e.id}" ${e.id === u.employee_id ? 'selected' : ''} ${t ? 'disabled' : ''}>${esc(fullName(e))}${e.active ? '' : ' (nieaktywny)'}${t ? ` — ma już konto: ${esc(t.display_name)}` : ''}</option>`; }).join('')}</optgroup>` : '';
        }).join('')}</select>
        <span class="hint">Możesz powiązać konto z dowolnym pracownikiem z Kadr. Wpisy i zatwierdzenia z tego konta zapiszą się przy tym pracowniku.</span></label>
      <div class="full"><h3 style="margin-top:6px">Uprawnienia</h3>
        <div class="row" style="margin-bottom:10px"><span class="hint">Szybki wybór roli:</span>${Object.keys(PRESETS).map(n => `<button type="button" class="btn sm" data-preset="${esc(n)}">${esc(n)}</button>`).join('')}</div>
        <div class="perms">${PERMS.map(([k, l, d]) => `<label><input type="checkbox" name="perm_${k}" ${has(k) ? 'checked' : ''} ${self && k === 'uzytkownicy' ? 'disabled' : ''}><span><b>${esc(l)}</b><small>${esc(d)}${self && k === 'uzytkownicy' ? ' — nie możesz odebrać go sobie' : ''}</small></span></label>`).join('')}</div>
        <p class="hint" id="rolename" style="margin-bottom:0"></p></div>
      <label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="active" ${u.active !== false ? 'checked' : ''} ${self ? 'disabled' : ''}> Konto aktywne (zablokowany użytkownik nie może się zalogować)</label>
    </div>`,
    onSubmit: async x => {
      if (!x.display_name.trim()) throw new Error('Wpisz imię i nazwisko.');
      if (!/^\S+@\S+\.\S+$/.test(x.email.trim())) throw new Error('Wpisz poprawny adres e-mail.');
      const permissions = readPerms();
      if (!permissions.length) throw new Error('Zaznacz przynajmniej jedno uprawnienie.');
      if (isNew) {
        checkNewPassword(x.p1, x.p2);
        await api.users.create({ display_name: x.display_name, email: x.email, password: x.p1, employee_id: x.employee_id, permissions, active: !!x.active });
      } else {
        await api.users.update(u.id, { display_name: x.display_name.trim(), email: x.email, employee_id: x.employee_id || null, permissions, active: self ? true : !!x.active });
        if (self) Auth.user = { ...Auth.user, permissions, display_name: x.display_name.trim() };
      }
      closeModal(); toast(isNew ? 'Dodano użytkownika.' : 'Zapisano uprawnienia.'); render();
    } });
  function readPerms(){
    const p = PERMS.map(([k]) => k).filter(k => f.elements['perm_' + k].checked || (self && k === 'uzytkownicy'));
    if (p.includes('kontrahenci_edit') && !p.includes('kontrahenci_view')) p.push('kontrahenci_view');
    return p;
  }
  const sync = () => {
    if (f.elements.perm_kontrahenci_edit.checked) f.elements.perm_kontrahenci_view.checked = true;
    $('#rolename').textContent = 'Rola: ' + roleName(readPerms());
  };
  f.querySelectorAll('.perms input').forEach(i => i.onchange = sync);
  f.elements.employee_id.addEventListener('change', () => {
    const e = S.data.employees.find(x => x.id === f.elements.employee_id.value);
    if (e && !f.elements.display_name.value.trim()) f.elements.display_name.value = fullName(e);
  });
  f.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const p = PRESETS[b.dataset.preset];
    PERMS.forEach(([k]) => { if (!(self && k === 'uzytkownicy')) f.elements['perm_' + k].checked = p.includes(k); });
    sync();
  });
  sync();
}
