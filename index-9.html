async function renderDriver(token){
  let st;
  try { st = await db.rpc('driver_get', { p_token: token }); }
  catch(e){ $('#app').innerHTML = `<div class="drv"><h1>Link nieaktywny</h1><p class="sub">${esc(e.message)}</p></div>`; return; }
  // zwrot właśnie zatwierdzony przez magazyn → pokaż podsumowanie
  const prev = S.driver && S.driver.token === token && S.driver.st.trip;
  if (prev && ['powrot', 'powrot_poprawa'].includes(prev.status) && !st.trip && st.last && st.last.id === prev.id && st.last.status === 'zakonczony')
    S.driverDone = { token, route: st.last.route_name, visited: st.last.visited, returned: st.last.qty_returned };
  S.driver = { token, st };
  const t = st.trip, e = st.employee;
  const hello = `<p class="muted" style="margin:0">${new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}</p>`;
  let html;
  const stable = '<p class="hint" style="text-align:center;margin-top:26px">To Twój stały link — używaj go codziennie, do każdej trasy. Możesz dodać go do ekranu głównego telefonu.</p><p style="text-align:center"><button class="btn sm ghost" data-act="reload">↻ Odśwież</button></p>' + linkFooter();
  if (!t && S.driverDone && S.driverDone.token === token) {
    const x = S.driverDone;
    html = `<div class="drv" style="text-align:center">${hello}
      <div class="pulse" style="background:var(--green-soft);animation:none">${CRATE_SVG}</div>
      <h1>Trasa zakończona</h1><p class="sub">Magazynier zatwierdził zwrot. ${esc(x.route)} — odwiedzeni klienci: ${x.visited}, zwrot na magazyn: ${x.returned} pojemników.</p>
      <button class="btn pri bigbtn" data-act="d-new">Rozpocznij kolejną trasę</button>${stable}</div>`;
  } else if (!t) {
    const qty = S.draft.qty ?? '';
    const sel = S.draft.routes || [];
    html = `<div class="drv">${hello}<h1>Dzień dobry, ${esc(e.first_name)}</h1><p class="sub">Wybierz trasę i wpisz, ile pustych pojemników zabierasz z firmy.</p>
      <h2>Trasa</h2>
      ${st.routes.length ? `<p class="hint" style="margin-top:-6px">Możesz zaznaczyć kilka tras — pojadą w jednym kursie.</p><div class="routes">${st.routes.map(r => `<label><input type="checkbox" name="route" value="${r.id}" ${sel.includes(r.id) ? 'checked' : ''} data-change="d-route" style="width:22px;height:22px"> ${esc(r.name)}</label>`).join('')}</div>` : '<p class="muted">Biuro nie dodało jeszcze tras.</p>'}
      <h2 style="margin-top:22px">Pojemniki do auta</h2>
      <div class="stepper"><button type="button" data-act="d-step" data-v="-1" aria-label="Mniej">−</button>
        <input id="dqty" type="number" inputmode="numeric" min="0" value="${esc(qty)}" placeholder="0" data-input="d-qty" aria-label="Liczba pojemników">
        <button type="button" data-act="d-step" data-v="1" aria-label="Więcej">+</button></div>
      <p class="err" id="derr"></p>
      <button class="btn pri bigbtn" data-act="d-start">Rozpocznij</button>
      <p class="hint" style="text-align:center">Po kliknięciu magazynier dostanie powiadomienie i podejdzie policzyć pojemniki.</p>${stable}</div>`;
  } else if (t.status === 'oczekuje') {
    html = `<div class="drv" style="text-align:center">${hello}<div class="pulse">${CRATE_SVG}</div>
      <h1>Czekaj przy aucie</h1><p class="sub">Magazynier dostał powiadomienie i sprawdzi, czy w aucie jest <b>${t.qty_declared}</b> pojemników.<br>${(st.trip_routes || []).length > 1 ? 'Trasy' : 'Trasa'}: ${esc(st.route ? st.route.name : '')}</p>
      <p class="hint">Ekran odświeży się sam po zatwierdzeniu.</p><button class="btn" data-act="d-cancel">Anuluj wyjazd</button></div>`;
  } else if (t.status === 'powrot') {
    html = `<div class="drv" style="text-align:center">${hello}<div class="pulse">${CRATE_SVG}</div>
      <h1>Czekaj na sprawdzenie zwrotu</h1><p class="sub">Magazynier dostał powiadomienie i policzy, czy oddajesz <b>${t.qty_return_declared}</b> pojemników.<br>Trasa: ${esc(st.route ? st.route.name : '')}</p>
      <p class="hint">Ekran odświeży się sam po zatwierdzeniu.</p><button class="btn" data-act="d-back">Wróć do trasy</button></div>`;
  } else if (t.status === 'powrot_poprawa') {
    html = `<div class="drv">${hello}<h1>Zwrot się nie zgadza</h1>
      <div class="card" style="border-left:4px solid var(--red);margin-bottom:18px">Zgłosiłeś zwrot <b>${t.qty_return_declared}</b>, a magazynier policzył <b>${t.qty_return_counted}</b>. Popraw liczbę i wyślij ponownie.</div>
      <div class="stepper"><button type="button" data-act="d-step" data-v="-1" aria-label="Mniej">−</button>
        <input id="dqty" type="number" inputmode="numeric" min="0" value="${esc(S.draft.qty ?? t.qty_return_counted)}" data-input="d-qty" aria-label="Liczba pojemników">
        <button type="button" data-act="d-step" data-v="1" aria-label="Więcej">+</button></div>
      <p class="err" id="derr"></p>
      <button class="btn pri bigbtn" data-act="d-return-resubmit">Wyślij ponownie</button>
      <p style="text-align:center"><button class="btn ghost" data-act="d-back">Wróć do trasy</button></p></div>`;
  } else if (t.status === 'do_poprawy') {
    html = `<div class="drv">${hello}<h1>Ilość się nie zgadza</h1>
      <div class="card" style="border-left:4px solid var(--red);margin-bottom:18px">Wpisałeś <b>${t.qty_declared}</b>, a magazynier policzył <b>${t.qty_counted}</b>. Popraw liczbę i wyślij ponownie.</div>
      <div class="stepper"><button type="button" data-act="d-step" data-v="-1" aria-label="Mniej">−</button>
        <input id="dqty" type="number" inputmode="numeric" min="0" value="${esc(S.draft.qty ?? t.qty_counted)}" data-input="d-qty" aria-label="Liczba pojemników">
        <button type="button" data-act="d-step" data-v="1" aria-label="Więcej">+</button></div>
      <p class="err" id="derr"></p>
      <button class="btn pri bigbtn" data-act="d-resubmit">Wyślij ponownie</button>
      <p style="text-align:center"><button class="btn ghost" data-act="d-cancel">Anuluj wyjazd</button></p></div>`;
  } else {
    const out = st.visits.reduce((a, m) => a + num(m.qty_out), 0), inn = st.visits.reduce((a, m) => a + num(m.qty_in), 0);
    const inCar = num(t.qty_loaded) - out + inn;
    const visited = new Set(st.visits.map(v => v.contractor_id));
    const allIds = [...new Set(st.stops.map(c => c.id))];
    const tr = st.trip_routes || [];
    if (!S.drvTab || !tr.some(r => r.id === S.drvTab)) S.drvTab = tr.length ? tr[0].id : null;
    const shown = tr.length > 1 ? st.stops.filter(c => c.route_id === S.drvTab) : st.stops;
    html = `<div class="drv">
      <div class="truck"><div><div class="small muted">${esc(st.route ? st.route.name : '')}</div><b>${inCar}</b> <span class="muted small">pojemników w aucie</span></div><span class="small muted">${allIds.filter(id => visited.has(id)).length}/${allIds.length} odwiedzonych</span></div>
      ${tr.length > 1 ? `<div class="tabs" style="display:flex;flex-wrap:wrap;width:100%;margin-bottom:12px">${tr.map(r => { const ids = st.stops.filter(c => c.route_id === r.id).map(c => c.id);
        return `<button data-act="d-tab" data-v="${r.id}" class="${S.drvTab === r.id ? 'on' : ''}" style="flex:1 1 40%;padding:10px">${esc(r.name)} <span class="small muted">${ids.filter(id => visited.has(id)).length}/${ids.length}</span></button>`; }).join('')}</div>` : ''}
      <div class="grid" style="gap:10px">
      ${shown.length ? shown.map((c, i) => {
        const v = st.visits.filter(x => x.contractor_id === c.id);
        return `<div class="stop ${v.length ? 'done' : ''}">
          <div><div class="nm">${i + 1}. ${esc(c.name)}</div><div class="small muted">${esc(addressOf(c))}</div>
          <div class="small" style="margin-top:4px">Pojemniki: <b style="color:${owe(c.balance, 'odbiorca').theyOwe ? 'var(--red)' : 'inherit'}">${oweText(c.balance, 'odbiorca')}</b>${palOn(c) || num(c.pal_balance) ? ` <span class="palt">· palety H1: ${oweText(c.pal_balance, 'odbiorca')}</span>` : ''}${v.length ? ` · dziś: ${mvText(sumMv(v), false) || 'bez zmian'}` : ''}</div></div>
          <div class="acts"><a class="btn" href="${esc(mapsUrl(c))}" target="_blank" rel="noopener">Nawiguj</a><button class="btn ${v.length ? '' : 'pri'}" data-act="d-visit" data-id="${c.id}">${v.length ? 'Odwiedź ponownie' : 'Odwiedź'}</button></div>
        </div>`; }).join('') : '<div class="card empty">Do tej trasy nie przypisano jeszcze klientów. Zadzwoń do biura.</div>'}
      </div><p class="hint" style="text-align:center;margin-top:16px">${tr.length > 1 ? 'Licznik pojemników w aucie jest wspólny dla wszystkich tras tego kursu.' : ''}</p></div>
      <div class="bottombar"><button class="btn ok" data-act="d-finish">Zakończ trasę</button></div>`;
  }
  $('#app').innerHTML = html;
}

function deliveryModal({ suppliers, preselect, who, save, allowDate = true }){
  if (!suppliers.length) return toast('Brak dostawców. Biuro musi ich dodać w zakładce Kontrahenci.', 'warn');
  const f = modal({ title: 'Nowa dostawa', submit: 'Zapisz dostawę', body: `<div class="f">
    <label class="l full">Dostawca<select name="cid">${suppliers.map(x => `<option value="${x.id}" ${x.id === preselect ? 'selected' : ''}>${esc(x.name)}${x.city ? ' — ' + esc(x.city) : ''}</option>`).join('')}</select>
      <span class="hint" id="supbal"></span></label>
    ${qtyFields(true)}
    ${allowDate ? `<label class="l full">Data dostawy<input name="date" type="datetime-local" value="${toLocalInput(new Date())}" max="${toLocalInput(new Date())}"></label>` : ''}
    <label class="l full">Uwagi<textarea name="note" placeholder="np. numer WZ, uszkodzone pojemniki"></textarea></label>
    <p class="hint full" style="margin:0">Dostawa zostanie zapisana jako: <b>${esc(who)}</b></p></div>`,
    onSubmit: async x => {
      const q = readQty(x);
      const date = allowDate ? dateFromInput(x.date) : new Date().toISOString();
      await save({ cid: x.cid, ...q, note: x.note || null, date: db.kind === 'supabase' ? date : x.date, iso: date });
      closeModal(); toast('Zapisano dostawę.');
    } });
  const sel = f.elements.cid;
  const showBal = () => { const x = suppliers.find(y => y.id === sel.value);
    const ps = f.querySelector('.pal-sec'), on = palOn(x);
    if (ps) { ps.hidden = !on; if (!on) { f.elements.pin.value = 0; f.elements.pout.value = 0; } }
    if (!x || x.balance == null) { $('#supbal').textContent = ''; return; }
    const t = (v, what) => `${what}: ${oweText(v, 'dostawca')}`;
    $('#supbal').innerHTML = on ? `Obecnie — ${t(x.balance, 'pojemniki')} · ${t(x.pal_balance || 0, 'palety H1')}` : `Obecnie — ${t(x.balance, 'pojemniki')} · nie uczestniczy w obrocie paletami H1`;
    $('#supbal').style.color = x.balance < 0 || (on && (x.pal_balance || 0) < 0) ? 'var(--red)' : ''; };
  sel.onchange = showBal; showBal();
}
function supplierHistoryHtml(sup, entries){
  const rows = entries.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
  let run = sup.balance, prun = num(sup.pal_balance);
  const withRun = rows.map(m => { const r = { m, after: run, pafter: prun }; run -= num(m.qty_in) - num(m.qty_out); prun -= num(m.pal_in) - num(m.pal_out); return r; });
  const bt = supBalText(sup.balance), pt = supBalText(num(sup.pal_balance), true);
  const showP = parseHash().page === 'm' || S.showPal;
  return `<div class="bigbal" style="margin-bottom:4px"><b style="color:${bt.red ? 'var(--red)' : 'inherit'}">${bt.n}</b><span class="muted">${bt.t}</span></div>
    ${showP && (palOn(sup) || num(sup.pal_balance)) ? `<div class="bigbal pal" style="margin-bottom:6px"><b style="color:${pt.red ? 'var(--red)' : 'var(--muted)'}">${pt.n}</b><span class="muted">${pt.t}</span></div>` : ''}
    ${addressOf(sup) ? `<p class="small muted" style="margin:0 0 14px">${esc(addressOf(sup))}</p>` : ''}
    <h3>Historia dostaw (${rows.length})</h3>
    ${rows.length ? `<div class="grid" style="gap:8px">${withRun.map(({ m, after, pafter }) => `<div class="card small" style="margin:0">
      <div class="row" style="justify-content:space-between"><b>${fmtDT(m.created_at)}</b><span class="muted">po wpisie: <b style="color:var(--ink)">${oweText(after, 'dostawca', ' poj.')}</b>${showP && (palOn(sup) || pafter) ? ` <span class="palt">· ${oweText(pafter, 'dostawca', ' pal.')}</span>` : ''}</span></div>
      <div>${mvText(m, true, showP)}</div>
      <div class="muted">${esc(m.created_by_name || SRC[m.source] || '')}${m.note && m.note !== SRC[m.source] ? ' · ' + esc(m.note) : ''}</div></div>`).join('')}</div>`
      : '<p class="muted">Brak dostaw od tego dostawcy.</p>'}`;
}
function staffSuppliers(){
  const bm = balances(S.data.movements);
  return S.data.contractors.filter(c => c.type === 'dostawca').sort((a, b) => a.name.localeCompare(b.name, 'pl'))
    .map(c => ({ id: c.id, name: c.name, city: c.city, balance: balOf(bm, c), pal_balance: palOf(bm, c), uses_pallets: palOn(c) }));
}

// Sprawdzenie przy aucie: 2 zdjęcia paki (na żywo) + decyzja. kind: 'wyjazd' | 'powrot'
function drawClientHistory(h, limit){
  const box = $('#chist'); if (!box) return;
  if (!h.entries.length) { box.textContent = 'Brak wcześniejszych wpisów u tego klienta.'; return; }
  box.className = '';
  const who = m => m.source === 'kierowca' ? (m.created_by_name || 'Kierowca') : m.source === 'biuro' ? `Wpis od biura${m.created_by_name ? ' · ' + m.created_by_name : ''}` : SRC[m.source] || m.created_by_name || '';
  box.innerHTML = `<div class="grid" style="gap:6px">${h.entries.slice(0, limit).map(m => `<div class="card small" style="margin:0;padding:10px 12px${m.this_trip ? ';border-color:var(--crate)' : ''}">
      <div class="row" style="justify-content:space-between"><b>${fmtDT(m.created_at)}</b><span class="muted">po wpisie: <b style="color:var(--ink)">${oweText(m.after, 'odbiorca', ' poj.')}</b> <span class="palt">· ${oweText(m.pal_after, 'odbiorca', ' pal.')}</span></span></div>
      <div>${mvText(m, false)}${m.this_trip ? ' <span class="pill p-blue">ten kurs</span>' : ''}</div>
      <div class="muted">${esc(who(m))}${m.note && m.note !== who(m) ? ' · ' + esc(m.note) : ''}</div></div>`).join('')}</div>
    ${h.entries.length > limit ? `<button type="button" class="btn sm" id="chmore" style="margin-top:8px">Pokaż wszystkie (${h.entries.length})</button>` : ''}`;
  const more = $('#chmore'); if (more) more.onclick = () => drawClientHistory(h, h.entries.length);
}

function verifyModal({ kind, declared, expected, driver, who, decision = 'ok', save }){
  const ret = kind === 'powrot';
  const photos = [null, null];
  const f = modal({ title: (ret ? 'Sprawdzenie zwrotu — ' : 'Sprawdzenie wyjazdu — ') + driver, submit: 'Zatwierdź', body: `
    <p style="margin-top:0">Kierowca ${ret ? 'zwraca' : 'deklaruje'} <b>${declared}</b> pojemników.${ret && expected != null ? ` Według wpisów powinno być <b>${expected}</b>.` : ''}</p>
    <h3>Zdjęcia paki auta z pojemnikami</h3>
    <p class="hint" style="margin-top:-4px">Wymagane dwa zdjęcia zrobione teraz aparatem. Na zdjęciu zapisze się data, godzina i Twoje nazwisko.</p>
    <div class="shots" id="shots"></div>
    <div class="radios" style="flex-direction:column;margin-top:16px">
      <label><input type="radio" name="decision" value="ok" ${decision === 'ok' ? 'checked' : ''}><span>Ilość się zgadza<small>${ret ? 'Trasa zostanie zakończona' : 'Kierowca rusza w trasę'}</small></span></label>
      <label><input type="radio" name="decision" value="accept" ${decision === 'accept' ? 'checked' : ''}><span>Nie zgadza się — zatwierdź policzoną ilość<small>${ret ? 'Trasa zakończy się z policzonym zwrotem' : 'Kierowca rusza z policzoną ilością'}</small></span></label>
      <label><input type="radio" name="decision" value="fix" ${decision === 'fix' ? 'checked' : ''}><span>Nie zgadza się — odeślij do poprawy<small>Kierowca musi poprawić liczbę</small></span></label>
    </div>
    <label class="l" id="cntwrap" style="margin-top:12px">Ile policzyłeś?<input name="counted" type="number" min="0" inputmode="numeric"></label>`,
    onSubmit: async x => {
      const ph = checkPhotos(photos);
      if (x.decision !== 'ok' && x.counted === '') throw new Error('Wpisz policzoną liczbę pojemników.');
      await save(x.decision, x.decision === 'ok' ? null : +x.counted, ph); closeModal();
      toast(x.decision === 'fix' ? 'Odesłano kierowcy do poprawy.' : ret ? 'Zwrot zatwierdzony. Trasa zakończona.' : 'Zatwierdzono. Kierowca może ruszać.');
    } });
  const stamp = () => `${fmtDT(new Date())} · ${ret ? 'Powrót' : 'Wyjazd'} · ${driver} · sprawdza: ${who}`;
  const draw = () => {
    $('#shots').innerHTML = photos.map((p, i) => p
      ? `<div class="shot has"><img src="${p.data}" alt="Zdjęcie ${i + 1}"><button type="button" class="btn sm again" data-shot="${i}">Powtórz</button></div>`
      : `<button type="button" class="shot" data-shot="${i}"><span style="font-size:26px">📷</span>Zrób zdjęcie ${i + 1}</button>`).join('');
    $('#shots').querySelectorAll('[data-shot]').forEach(b => b.onclick = async () => {
      $('#merr').textContent = '';
      try { photos[+b.dataset.shot] = await capturePhoto(stamp()); draw(); }
      catch(e){ if (e) $('#merr').textContent = e.message; }
    });
  };
  const sync = () => { $('#cntwrap').style.display = f.querySelector('input[name=decision]:checked').value === 'ok' ? 'none' : ''; };
  f.querySelectorAll('input[name=decision]').forEach(r => r.onchange = sync);
  draw(); sync();
}
const expectedReturn = (t, mv) => num(t.qty_loaded) - mv.reduce((a, m) => a + num(m.qty_out), 0) + mv.reduce((a, m) => a + num(m.qty_in), 0);

async function renderWarehouseLink(token){
  let st;
  try { st = await db.rpc('wh_get', { p_token: token }); }
  catch(e){ $('#app').innerHTML = `<div class="drv"><h1>Link nieaktywny</h1><p class="sub">${esc(e.message)}</p></div>`; return; }
  const reqs = [...st.waiting, ...st.returning];
  const ids = reqs.map(t => t.id + ':' + t.status);
  if (S.whSeen && S.wh && S.wh.token === token) {
    const fresh = reqs.filter(t => !S.whSeen.includes(t.id + ':' + t.status));
    if (fresh.length) {
      beep(); try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch(e){}
      fresh.forEach(t => { try { if ('Notification' in window && Notification.permission === 'granted') new Notification(t.status === 'powrot' ? `${t.driver_name} wrócił — sprawdź zwrot` : `${t.driver_name} czeka przy aucie`, { body: `${t.route_name} — ${t.status === 'powrot' ? t.qty_return_declared : t.qty_declared} pojemników` }); } catch(e){} });
    }
  }
  S.whSeen = ids; S.wh = { token, st };
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const tab = S.whTab || 'wyjazdy';
  const head = `<div class="drv">
    <p class="muted" style="margin:0">${new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <h1>Cześć, ${esc(st.employee.first_name)}</h1>
    ${perm === 'default' ? '<button class="btn bigbtn" data-act="w-perm" style="margin:8px 0 14px">Włącz powiadomienia i dźwięk</button>' : ''}
    <div class="tabs" style="display:flex;width:100%;margin:10px 0 18px">
      <button data-act="w-tab" data-v="wyjazdy" class="${tab === 'wyjazdy' ? 'on' : ''}" style="flex:1;padding:10px">Kierowcy ${reqs.length ? `<span class="badge">${reqs.length}</span>` : ''}</button>
      <button data-act="w-tab" data-v="dostawy" class="${tab === 'dostawy' ? 'on' : ''}" style="flex:1;padding:10px">Dostawy</button></div>`;
  if (tab === 'dostawy') {
    if (S.whSup) {
      let h;
      try { h = await db.rpc('wh_supplier_history', { p_token: token, p_contractor_id: S.whSup }); }
      catch(e){ S.whSup = null; return renderWarehouseLink(token); }
      $('#app').innerHTML = head + `<button class="btn ghost" data-act="w-back" style="padding-left:0">← Wszyscy dostawcy</button>
        <h2 style="margin-top:6px">${esc(h.supplier.name)}</h2>
        ${supplierHistoryHtml(h.supplier, h.entries)}</div>
        <div class="bottombar"><button class="btn pri" data-act="w-deliv" data-id="${h.supplier.id}">Dodaj dostawę od tego dostawcy</button></div>`;
      return;
    }
    $('#app').innerHTML = head + `<button class="btn pri bigbtn" data-act="w-deliv" style="margin-bottom:18px">Dodaj dostawę</button>
      <h2>Dostawcy</h2><p class="hint" style="margin-top:-6px">Dotknij dostawcy, żeby zobaczyć historię dostaw.</p>
      <div class="grid" style="gap:8px">${st.suppliers.length ? st.suppliers.map(x => `<div class="stop" data-act="w-sup" data-id="${x.id}" style="cursor:pointer;grid-template-columns:1fr auto;align-items:center">
        <div><div class="nm">${esc(x.name)}</div><div class="small muted">${esc(x.city || '')}</div></div>
        <div style="text-align:right">${[[x.balance, 'poj.'], ...(palOn(x) || num(x.pal_balance) ? [[num(x.pal_balance), 'pal. H1']] : [])].map(([v, u]) => (u === 'poj.' ? `<div style="color:${v < 0 ? 'var(--red)' : v > 0 ? 'var(--green)' : 'inherit'}"><span class="small">${owe(v, 'dostawca').theyOwe === null ? 'rozliczone' : owe(v, 'dostawca').t}</span> <b style="font-size:22px;font-stretch:72%">${Math.abs(v)}</b> <span class="small muted">${u}</span></div>`
        : `<div class="palt" style="${v < 0 ? 'color:var(--red)' : ''}">${oweText(v, 'dostawca', ' ' + u)}</div>`)).join('')}</div></div>`).join('')
        : '<div class="card empty">Brak dostawców. Biuro dodaje ich w zakładce Kontrahenci.</div>'}</div></div>`;
    return;
  }
  $('#app').innerHTML = head + `
    <p class="sub">Tu pojawiają się kierowcy czekający na sprawdzenie pojemników — przy wyjeździe i po powrocie z trasy. Zostaw tę stronę otwartą — usłyszysz sygnał.</p>
    ${st.returning.length ? `<h2>Powroty do sprawdzenia (${st.returning.length})</h2>
    <div class="grid" style="gap:10px;margin-bottom:22px">${st.returning.map(t => { const exp = num(t.qty_loaded) - num(t.out) + num(t.inn), diff = num(t.qty_return_declared) - exp;
      return `<div class="stop wait">
      <div><div class="row" style="justify-content:space-between"><span class="nm">${esc(t.driver_name)}</span><span class="pill p-amber">powrót ${fmtT(t.returned_at)}</span></div>
      <div class="small muted">${esc(t.route_name)} · wizyt: ${t.visits}</div></div>
      <div class="bigbal"><b>${t.qty_return_declared}</b><span class="muted">pojemników zwraca kierowca</span></div>
      <div class="small">Według wpisów w aucie powinno być <b>${exp}</b>${diff ? ` <span style="color:var(--red)">(różnica ${diff > 0 ? '+' : ''}${diff})</span>` : ''}</div>
      <div class="acts"><button class="btn ok" data-act="wr-ok" data-id="${t.id}">Zgadza się</button><button class="btn bad" data-act="wr-bad" data-id="${t.id}">Nie zgadza się</button></div>
    </div>`; }).join('')}</div>` : ''}
    <h2>Czekają przy aucie (${st.waiting.length})</h2>
    <div class="grid" style="gap:10px">
    ${st.waiting.length ? st.waiting.map(t => `<div class="stop wait">
      <div><div class="row" style="justify-content:space-between"><span class="nm">${esc(t.driver_name)}</span><span class="small muted">${fmtT(t.created_at)}</span></div>
      <div class="small muted">${esc(t.route_name)}</div></div>
      <div class="bigbal"><b>${t.qty_declared}</b><span class="muted">pojemników deklaruje kierowca</span></div>
      <div class="acts"><button class="btn ok" data-act="w-ok" data-id="${t.id}">Zgadza się</button><button class="btn bad" data-act="w-bad" data-id="${t.id}">Nie zgadza się</button></div>
    </div>`).join('') : '<div class="card empty">Nikt nie czeka. Gdy kierowca zgłosi wyjazd, pojawi się tutaj.</div>'}
    </div>
    ${st.fixing.length || st.return_fixing.length ? `<h3 style="margin-top:22px">Odesłane do poprawy</h3>${st.fixing.map(t => `<div class="card small"><b>${esc(t.driver_name)}</b> — wyjazd: zadeklarował ${t.qty_declared}, policzono ${t.qty_counted}</div>`).join('')}${st.return_fixing.map(t => `<div class="card small"><b>${esc(t.driver_name)}</b> — zwrot: zgłosił ${t.qty_return_declared}, policzono ${t.qty_return_counted}</div>`).join('')}` : ''}
    <h3 style="margin-top:22px">W trasie (${st.onroad.length})</h3>
    ${st.onroad.length ? st.onroad.map(t => `<div class="card small"><b>${esc(t.driver_name)}</b> · ${esc(t.route_name)}<div class="muted">wyjazd ${fmtT(t.started_at)} · wizyt: ${t.visits}</div></div>`).join('') : '<p class="muted small">Nikt nie jest w trasie.</p>'}
    <p class="hint" style="text-align:center;margin-top:26px">To Twój stały link — działa codziennie, bez limitu. Możesz dodać go do ekranu głównego telefonu.</p>
    <p style="text-align:center"><button class="btn sm ghost" data-act="reload">↻ Odśwież</button></p>${linkFooter()}
  </div>`;
}

      await api.removeConfirmation(x.id); toast('Usunięto potwierdzenie.');

  'pal-view'(el){ S.showPal = el.dataset.v === '1'; prefs.set('showPal', S.showPal ? '1' : '0'); S.keepScroll = true; render(); },
  'f-toggle'(el){
    const k = el.dataset.v + 'Open'; S[k] = !S[k]; render().then(() => {
      if (S[k]) { const i = $('.main .panel input, .main .panel select'); if (i) i.focus(); }
    });
  },
  'tf-clear'(){ S.tf = { route: '', driver: '', from: '', to: '', status: '' }; render(); },
  reload(){ location.reload(); },
  'd-tab'(el){ S.drvTab = el.dataset.v; window.scrollTo(0, 0); render(); },
  'd-new'(){ S.driverDone = null; S.draft = {}; render(); },
  async 'd-back'(){
    if (await confirmBox('Wrócić do trasy?', 'Zgłoszenie powrotu zostanie wycofane. Możesz dopisać wizyty i zgłosić powrót jeszcze raz.', 'Wróć do trasy')) {
      await db.rpc('driver_back_to_route', { p_token: S.driver.token, p_trip_id: S.driver.st.trip.id }); render();
    }
  },
  async 'd-return-resubmit'(){
    const qty = $('#dqty').value; if (qty === '') return ($('#derr').textContent = 'Wpisz liczbę pojemników.');
    try { await db.rpc('driver_return_resubmit', { p_token: S.driver.token, p_trip_id: S.driver.st.trip.id, p_qty: +qty }); S.draft = {}; render(); }
    catch(e){ $('#derr').textContent = e.message; }
  },
  'd-finish'(){
    const st = S.driver.st, t = st.trip;
    const exp = num(t.qty_loaded) - st.visits.reduce((a, m) => a + num(m.qty_out), 0) + st.visits.reduce((a, m) => a + num(m.qty_in), 0);
    const left = st.stops.filter((c, i, a) => a.findIndex(x => x.id === c.id) === i && !st.visits.some(v => v.contractor_id === c.id));
    modal({ title: 'Zakończ trasę', submit: 'Zgłoś powrót', body: `
      ${left.length ? `<p class="card" style="border-left:4px solid var(--amber)">Nie odwiedzono: ${left.map(c => esc(c.name)).join(', ')}</p>` : ''}

      <label class="l">Ile pojemników zwracasz na magazyn?<input name="ret" type="number" min="0" inputmode="numeric" value="${exp}"></label>

      onSubmit: async f => {
        if (f.ret === '' || num(f.ret) < 0) throw new Error('Wpisz liczbę pojemników.');
        await db.rpc('driver_finish', { p_token: S.driver.token, p_trip_id: t.id, p_qty_returned: num(f.ret) });
        S.draft = {}; closeModal(); window.scrollTo(0, 0); render();
      } });
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) {
    if (el.tagName !== 'A' || el.getAttribute('href') === '#') e.preventDefault();
    const act = el.dataset.act;
    const need = act === 'm-add' ? (el.dataset.src === 'magazyn' ? 'magazyn' : 'kontrahenci_edit') : ACT_PERM[act];
    if (need && !['k', 'm'].includes(parseHash().page) && !can(need)) { toast('Nie masz uprawnień do tej operacji.', 'warn'); return; }
    Promise.resolve(A[el.dataset.act](el, e)).catch(err => { console.error(err); toast(err.message, 'warn'); }); return; }
  const go = e.target.closest('[data-go]');
  if (go && !e.target.closest('a,button')) location.hash = go.dataset.go;
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (k === 'df-q') { S.df.q = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('[data-input="df-q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); }
  if (k === 'kq') { S.kq = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('[data-input=kq]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); }
  if (k === 'd-qty') S.draft.qty = e.target.value;
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'd-route') S.draft.routes = [...document.querySelectorAll('input[name=route]:checked')].map(x => x.value);
  if (k === 'df') { S.df[e.target.dataset.k] = e.target.value; e.target.blur(); render(); }
  if (k === 'tf') { S.tf[e.target.dataset.k] = e.target.value; e.target.blur(); render(); }
  if (k === 'appUrl') {
    const v = e.target.value.trim();
    if (v && !/^https?:\/\//.test(v)) { toast('Adres musi zaczynać się od https://', 'warn'); return; }
    prefs.set('appUrl', v); toast(v ? 'Zapisano. Skopiuj linki w Kadrach ponownie.' : 'Linki będą budowane z bieżącego adresu.');
  }
});

function assignForm(routeId){
  const d = S.data;
  const recv = d.contractors.filter(c => c.type === 'odbiorca').sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  const rn = id => (d.routes.find(r => r.id === id) || {}).name;
  if (!recv.length) return toast('Najpierw dodaj odbiorców w zakładce Kontrahenci.', 'warn');
  modal({ title: 'Przypisz odbiorców do trasy', submit: 'Zapisz', wide: true, body: `

    ${recv.map(c => `<label style="display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center">
      <input type="checkbox" name="c_${c.id}" ${routesOfC(c.id).some(r => r.id === routeId) ? 'checked' : ''}><span style="flex:1"><b>${esc(c.name)}</b><br><span class="small muted">${esc(addressOf(c))}</span></span>

      const stops = stopsOfRoute(routeId);

    } });

   także w bazie (RLS), więc nie da się ich obejść.
   ===================================================================== */
const Auth = {
  user: null,
  can(p){ return !!(this.user && this.user.active && (this.user.permissions || []).includes(p)); },
  async ensure(){
    if (db.kind === 'supabase') {
      const { data } = await db.client.auth.getSession();
      if (!data.session) { this.user = null; this.renderLogin(); return false; }
      let rows = [], err = null;
      try { rows = await db.list('app_users', { eq: { auth_user_id: data.session.user.id } }); } catch(e){ err = e.message; }
      this.user = rows[0] || null;
      if (!this.user) { this.renderBlocked(err ? `Nie udało się odczytać profilu: ${err}` : `Konto ${data.session.user.email} jest zalogowane, ale nie ma profilu w aplikacji. Administrator musi dodać je w zakładce Użytkownicy (albo powiązać w tabeli app_users).`); return false; }
      if (!this.user.active) { this.renderBlocked('To konto jest zablokowane. Odblokuje je administrator w zakładce Użytkownicy.'); return false; }
      return true;
    }
    const users = await db.list('app_users');
    if (!users.length) { this.user = null; this.renderSetup(); return false; }
    const id = prefs.get('session');
    this.user = users.find(u => u.id === id && u.active) || null;
    if (!this.user) { this.renderLogin(); return false; }
    return true;
  },
  async login(email, pwd){
    email = email.trim().toLowerCase();
    if (db.kind === 'supabase') {
      const { error } = await db.client.auth.signInWithPassword({ email, password: pwd });
      if (error) {   // pokaż konkretną przyczynę, żeby łatwiej było ją naprawić
        const m = (error.message || '').toLowerCase();
        if (m.includes('invalid login')) throw new Error('Nieprawidłowy e-mail lub hasło. Jeśli konto zakładano w wersji lokalnej, trzeba je założyć ponownie w zakładce Użytkownicy.');
        if (m.includes('not confirmed')) throw new Error('Konto nie jest potwierdzone. W Supabase (Authentication → Users) potwierdź je albo załóż ponownie z opcją Auto Confirm.');
        if (m.includes('banned')) throw new Error('To konto jest zablokowane. Odblokuje je administrator w zakładce Użytkownicy.');
        throw new Error('Logowanie nieudane: ' + error.message);
      }
      return;
    }
    const u = (await db.list('app_users', { eq: { email } }))[0];
    if (!u || !(await checkPassword(pwd, u.password_hash))) throw new Error('Nieprawidłowy e-mail lub hasło.');
    if (!u.active) throw new Error('To konto jest zablokowane. Skontaktuj się z administratorem.');
    prefs.set('session', u.id);
    await db.update('app_users', u.id, { last_login_at: new Date().toISOString() });
  },
  async logout(){
    if (db.kind === 'supabase') await db.client.auth.signOut(); else prefs.set('session', '');
    this.user = null; S.seenNotif = null; location.hash = ''; render();
  },
  shell(inner){
    $('#app').innerHTML = `<div class="auth"><div class="brand" style="justify-content:center"><img src="${LOGO}" alt="Star Drób" class="logo" style="max-width:280px"></div>${inner}</div>`;
  },
  bind(fn){
    const f = $('#authform');
    f.onsubmit = async e => {
      e.preventDefault(); const btn = f.querySelector('button'); btn.disabled = true; $('#lerr').textContent = '';
      try { await fn(Object.fromEntries(new FormData(f).entries())); render(); }
      catch(err){ $('#lerr').textContent = err.message; }
      finally { btn.disabled = false; }
    };
    const i = f.querySelector('input'); if (i) i.focus();
  },
  renderLogin(){
    this.shell(`<h1>Zaloguj się</h1><p class="sub">Konto zakłada administrator w zakładce Użytkownicy.</p>
      <form id="authform" class="grid" style="gap:12px"><label class="l">E-mail<input name="email" type="email" autocomplete="username"></label>
      <label class="l">Hasło<input name="password" type="password" autocomplete="current-password"></label><p class="err" id="lerr"></p>
      <button class="btn pri bigbtn">Zaloguj</button></form>`);
    this.bind(x => this.login(x.email, x.password));
  },
  renderSetup(){
    this.shell(`<h1>Utwórz konto administratora</h1><p class="sub">To pierwsze uruchomienie. Administrator ma wszystkie uprawnienia i może dodawać kolejnych użytkowników.</p>
      <form id="authform" class="grid" style="gap:12px"><label class="l">Imię i nazwisko<input name="display_name" autocomplete="name"></label>
      <label class="l">E-mail (login)<input name="email" type="email" autocomplete="username"></label>
      <label class="l">Hasło<input name="p1" type="password" autocomplete="new-password" placeholder="min. 8 znaków"></label>
      <label class="l">Powtórz hasło<input name="p2" type="password" autocomplete="new-password"></label><p class="err" id="lerr"></p>
      <button class="btn pri bigbtn">Utwórz konto i zaloguj</button></form>`);
    this.bind(async x => {
      if (!x.display_name.trim()) throw new Error('Wpisz imię i nazwisko.');
      if (!/^\S+@\S+\.\S+$/.test(x.email.trim())) throw new Error('Wpisz poprawny adres e-mail.');
      checkNewPassword(x.p1, x.p2);
      const u = await api.users.create({ display_name: x.display_name, email: x.email, password: x.p1, permissions: PRESETS['Administrator'], active: true });
      prefs.set('session', u.id);
      await db.update('app_users', u.id, { last_login_at: new Date().toISOString() });
    });
  },
  renderBlocked(reason){
    this.shell(`<h1>Brak dostępu</h1><p class="sub">${esc(reason || 'Twoje konto nie jest aktywne albo nie ma przypisanych uprawnień. Skontaktuj się z administratorem.')}</p>
      <button class="btn" data-act="logout">Wyloguj</button>`);
  }
};

   START
   ===================================================================== */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Nie udało się wczytać ' + src)); document.head.appendChild(s); }); }
async function boot(){
  if (CONFIG.backend === 'supabase') {
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
    db = createSupabaseAdapter();
    db.client.auth.onAuthStateChange(() => scheduleRender());
  } else {
    db = createLocalAdapter();
    const legacy = (await db.list('contractors')).filter(c => c.route_id);
    for (const c of legacy.sort((a, b) => (a.route_order || 0) - (b.route_order || 0))) {
      if (!(await db.list('route_stops', { eq: { route_id: c.route_id, contractor_id: c.id } })).length)
        await db.insert('route_stops', { route_id: c.route_id, contractor_id: c.id, position: c.route_order || 0 });
      await db.update('contractors', c.id, { route_id: null, route_order: null });
    }
  }
  let t; db.subscribe(() => { clearTimeout(t); t = setTimeout(scheduleRender, 120); });
  setInterval(() => { if (['k', 'm'].includes(parseHash().page) || db.kind === 'supabase') scheduleRender(); }, 5000); // zapasowe odświeżanie
  window.addEventListener('hashchange', () => { S.draft = {}; closeModal(); window.scrollTo(0, 0); render(); });
  render();
}
boot().catch(e => { $('#app').innerHTML = `<div class="drv"><h1>Nie udało się uruchomić</h1><p class="sub">${esc(e.message)}</p></div>`; });
</script>
